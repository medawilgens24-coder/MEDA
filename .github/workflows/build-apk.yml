name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enstale depandans
        run: |
          npm install
          python3 -m pip install pillow

      - name: Prepare paj web la
        run: python3 tools.py web

      - name: Kreye pwojè Android
        run: npx cap add android

      - name: Aplike MainActivity, ikòn ak splash
        run: python3 tools.py android

      - name: Senkronize
        run: npx cap sync android

      - name: Konstwi APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Non APK a = MEDA.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MEDA.apk

      - name: Voye APK a
        uses: actions/upload-artifact@v4
        with:
          name: MEDA-apk
          path: MEDA.apk
