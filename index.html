/* ---- Toast (nouvo mesaj) ---- */
function showToast({title, message, onClick, duration}={}){
  let container = document.getElementById('toast-container');
  if(!container){
    container = document.createElement('div');
    container.id = 'toast-container';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `
    <div class="toast-icon">${ICONS.chat}</div>
    <div class="toast-body">
      <div class="toast-title"></div>
      <div class="toast-msg"></div>
    </div>
    <button type="button" class="toast-close" aria-label="Fèmen">&times;</button>`;
  el.querySelector('.toast-title').textContent = title || '';
  el.querySelector('.toast-msg').textContent = message || '';
  container.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('toast-show'));
  const close = ()=>{ el.classList.remove('toast-show'); setTimeout(()=>el.remove(), 180); };
  const timer = setTimeout(close, duration || 6000);
  el.addEventListener('click', e=>{
    clearTimeout(timer);
    if(e.target.closest('.toast-close')){ close(); return; }
    close();
    if(onClick) onClick();
  });
}

/* ---- Ti son diskrè lè yon nouvo mesaj rive (san fichye odyo, sa mache òfliy) ---- */
let _notifAudioCtx = null;
function playNotifSound(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    if(!_notifAudioCtx) _notifAudioCtx = new Ctx();
    const ctx = _notifAudioCtx;
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.14, ctx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.32);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.33);
  }catch(e){ /* san son si sa pa mache — pa enpòtan */ }
}

/* ---- Deteksyon nouvo mesaj — push an tan reyèl si Firebase aktive,
   sinon sondaj peryodik (chak 9s) sou sistèm depo pa defo a ---- */
let _msgPollHandle = null;
let _fbMsgHandler = null;
let _notifRole = null;
function startMessageNotifications(role){
  if(_notifRole===role && (_msgPollHandle || _fbMsgHandler)) return;
  stopMessageNotifications();
  _notifRole = role;
  if(FIREBASE_ENABLED && fbDb){
    _fbMsgHandler = snap=>{
      if(document.hidden || !snap.exists()) return;
      diffAndNotifyMessages(snap.val(), role);
    };
    fbDb.ref(schoolDataRefPath()).on('value', _fbMsgHandler);
  } else {
    _msgPollHandle = setInterval(()=>checkForNewMessages(role), 9000);
  }
}
function stopMessageNotifications(){
  if(_msgPollHandle){ clearInterval(_msgPollHandle); _msgPollHandle=null; }
  if(_fbMsgHandler && fbDb){ fbDb.ref(schoolDataRefPath()).off('value', _fbMsgHandler); _fbMsgHandler=null; }
  _notifRole = null;
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && _notifRole) checkForNewMessages(_notifRole);
});

/* Konpare done fre yo (ki soti swa nan Firebase, swa nan ansyen depo a) ak
   sa n gen lokalman, epi deklannche notifikasyon pou nouvo mesaj yo. */
function diffAndNotifyMessages(fresh, role){
  if(!DATA) return;
  const freshMsgs = Array.isArray(fresh.messages) ? fresh.messages : [];
  const localMsgs = ensureMessages();
  if(freshMsgs.length===localMsgs.length && JSON.stringify(freshMsgs)===JSON.stringify(localMsgs)) return;
  const knownIds = new Set(localMsgs.map(m=>m.id));
  const otherSender = role==='admin' ? 'teacher' : 'admin';
  const relevantNew = freshMsgs.filter(m=> !knownIds.has(m.id) && m.sender===otherSender &&
    (role==='admin' || m.teacherId===session.teacherId));
  DATA.messages = freshMsgs;
  relevantNew.forEach(m=>notifyNewMessage(m, role));
  refreshMessagingUI(role);
}

async function checkForNewMessages(role){
  if(!DATA || document.hidden) return;
  try{
    if(FIREBASE_ENABLED && fbDb){
      const snap = await fbDb.ref(schoolDataRefPath()).get();
      if(!snap.exists()) return;
      diffAndNotifyMessages(snap.val(), role);
    } else {
      const r = await window.storage.get(schoolStorageKey(), true);
      if(!r) return;
      diffAndNotifyMessages(JSON.parse(r.value), role);
    }
  }catch(e){ /* erè tanporè rezo/depo — pa deranje itilizatè a */ }
}

function notifyNewMessage(m, role){
  const teacher = findTeacherById(m.teacherId);
  const fromLabel = m.sender==='admin' ? 'Administrasyon' : teacherDisplayName(teacher);
  const preview = (m.text || '').slice(0, 90);
  playNotifSound();
  showToast({
    title: `Nouvo mesaj de ${fromLabel}`,
    message: preview,
    onClick: ()=>{
      if(role==='admin'){ ui.adminView='mesaj'; ui.msgTeacherId=m.teacherId; ui.msgShowProfile=false; render('admin'); }
      else { ui.teacherView='mesaj'; render('teacher'); }
    }
  });
  if(document.hidden && 'Notification' in window && Notification.permission==='granted'){
    try{
      const n = new Notification(`Nouvo mesaj de ${fromLabel}`, {body: preview, tag: 'msg-'+m.id});
      n.onclick = ()=>{ window.focus(); n.close(); };
    }catch(e){}
  }
}

/* Mete ajou badj yo san deranje ekran/chan aktyèl itilizatè a; rafrechi tout
   fè nan plas sèlman lè li deja sou paj mesaj yo (pa gen risk pèdi fokis chan). */
function refreshMessagingUI(role){
  const unread = role==='admin' ? totalUnreadForAdmin() : unreadFromAdmin(session.teacherId);
  document.querySelectorAll('[data-nav="mesaj"]').forEach(btn=>{
    let badge = btn.querySelector('.nav-badge');
    if(unread>0){
      if(!badge){ badge = document.createElement('span'); badge.className='nav-badge'; btn.appendChild(badge); }
      badge.textContent = unread>9?'9+':unread;
    } else if(badge){ badge.remove(); }
  });
  const onAdminThread = role==='admin' && ui.adminView==='mesaj' && ui.msgTeacherId && !ui.msgShowProfile;
  const onTeacherThread = role==='teacher' && ui.teacherView==='mesaj';
  if(onAdminThread || onTeacherThread){
    const tId = role==='admin' ? ui.msgTeacherId : session.teacherId;
    const justRead = ensureMessages().filter(m=>m.teacherId===tId && m.sender!==role && !m.read);
    if(justRead.length){ justRead.forEach(m=>m.read=true); saveData(); }
    role==='admin' ? render('admin') : render('teacher');
  } else if(role==='admin' && ui.adminView==='mesaj'){
    render('admin');
  }
}

/* ===================== ANNÉE SCOLAIRE (multi-années) =====================
   DATA.classes / DATA.terms toujou reprezante done ANE AKADEMIK AKTIF la
   sèlman — tout rès kòd aplikasyon an (klas, elèv, nòt, palmarès, bilten,
   orè, dashboard) kontinye li/ekri DATA.classes / DATA.terms san chanjman,
   egzakteman jan yo te fè anvan.
   DATA.academicYears = { "2025-2026": {classes:[...], terms:[...]}, ... }
   se depo ki konsève TOUT ane yo. syncActiveYearStore() re-lye ane aktif la
   nan depo a anvan chak sovgad, e switchActiveYear() chanje ki ane ki
   "vizib" nan DATA.classes / DATA.terms. */
function isValidYearFormat(s){
  const m = /^(\d{4})-(\d{4})$/.exec(String(s||'').trim());
  return !!m && Number(m[2])===Number(m[1])+1;
}
function defaultYearLabel(){
  const d = new Date();
  const y = d.getFullYear();
  const start = d.getMonth()>=6 ? y : y-1;
  return `${start}-${start+1}`;
}
function ensureYearRecord(year){
  if(!DATA.academicYears || typeof DATA.academicYears!=='object') DATA.academicYears = {};
  if(!DATA.academicYears[year]) DATA.academicYears[year] = { classes:[], terms:[...DEFAULT_TERMS] };
  return DATA.academicYears[year];
}
function syncActiveYearStore(){
  if(!DATA.activeYear) return;
  ensureYearRecord(DATA.activeYear);
  DATA.academicYears[DATA.activeYear] = { classes: DATA.classes||[], terms: (DATA.terms&&DATA.terms.length? DATA.terms : [...DEFAULT_TERMS]) };
}
/* Migrasyon: si DATA a te kreye anvan sistèm multi-années la, mete tout
   ansyen done (DATA.classes/DATA.terms ki te egziste deja) anba yon sèl
   ane akademik, san pèdi ni doubli anyen. Fèt yon sèl fwa. */
function migrateAcademicYears(){
  if(DATA.academicYears && typeof DATA.academicYears==='object' && Object.keys(DATA.academicYears).length && DATA.activeYear){
    ensureYearRecord(DATA.activeYear);
    return;
  }
  const school = ensureSchool();
  const year = isValidYearFormat(school.year) ? school.year.trim() : defaultYearLabel();
  DATA.academicYears = {};
  DATA.academicYears[year] = {
    classes: Array.isArray(DATA.classes) ? DATA.classes : [],
    terms: (DATA.terms && DATA.terms.length) ? DATA.terms : [...DEFAULT_TERMS]
  };
  DATA.activeYear = year;
  DATA.classes = DATA.academicYears[year].classes;
  DATA.terms = DATA.academicYears[year].terms;
  school.year = year;
}
/* Tout klas, nan tout ane akademik yo, ansanm ak ki ane yo soti */
function allClassesAcrossYears(){
  syncActiveYearStore();
  const list = [];
  Object.keys(DATA.academicYears||{}).forEach(year=>{
    (DATA.academicYears[year].classes||[]).forEach(c=> list.push({year, cls:c}));
  });
  return list;
}
/* ===================== MIGRASYON PWOFESÈ (pwofil inik) =====================
   Ansyen sistèm nan te konsève yon teacherName + teacherProfile SOU CHAK
   KLAS — sa te ka kreye plizyè "moun" pou menm pwofesè a si li te nan
   plizyè klas. Fonksyon sa a fèt YON SÈL FWA: li gwoupe klas ki gen menm
   non pwofesè (menm òtograf), kreye YON SÈL pwofil DATA.teachers pou yo,
   epi lye chak klas ak cls.teacherId. Kòd koneksyon pwofesè a vin kòd
   premye klas li te genyen an, pou ansyen kòd la kontinye mache. Ansyen
   mesaj yo (ki te make sèlman pa classId) rekonekte tou ak teacherId
   pwofesè ki gen klas sa a kounye a. Ni teacherName ni teacherProfile
   pa efase sou klas yo — yo rete la kòm referans/backup. */
function migrateTeacherProfiles(){
  ensureTeachers();
  if(!DATA.teachersMigrated){
    const nameMap = new Map();
    allClassesAcrossYears().forEach(({cls})=>{
      if(cls.teacherId) return;
      const rawName = (cls.teacherName||'').trim();
      if(!rawName) return;
      const key = normNameKey(rawName);
      let teacher = nameMap.get(key);
      if(!teacher){
        const {prenom, nom} = splitFullName(rawName);
        const tp = cls.teacherProfile || {};
        teacher = createTeacher({
          prenom: tp.prenom || prenom,
          nom: nom,
          username: rawName,
          phone: tp.phone,
          email: tp.email,
          code: cls.code
        });
        teacher.sexe = tp.sexe || '';
        teacher.dob = tp.dob || '';
        teacher.address = tp.address || '';
        teacher.poste = tp.poste || '';
        teacher.diplome = tp.diplome || '';
        teacher.photo = tp.photo || null;
        teacher.experience = (tp.experience!=null) ? tp.experience : null;
        nameMap.set(key, teacher);
      }
      cls.teacherId = teacher.id;
    });
    const classIndex = new Map();
    allClassesAcrossYears().forEach(({cls})=> classIndex.set(cls.id, cls));
    ensureMessages().forEach(m=>{
      if(!m.teacherId && m.classId){
        const cls = classIndex.get(m.classId);
        if(cls && cls.teacherId) m.teacherId = cls.teacherId;
      }
    });
    DATA.teachersMigrated = true;
    syncActiveYearStore();
  }
}
function yearStats(year){
  const rec = (year===DATA.activeYear) ? {classes:DATA.classes||[], terms:DATA.terms||[]} : (DATA.academicYears && DATA.academicYears[year]);
  if(!rec) return {classes:0, students:0, notes:0};
  const classes = rec.classes || [];
  let students = 0, notes = 0;
  classes.forEach(c=>{
    students += (c.students||[]).length;
    const g = c.grades || {};
    Object.keys(g).forEach(term=>{
      Object.keys(g[term]||{}).forEach(sid=>{ notes += Object.keys(g[term][sid]||{}).length; });
    });
  });
  return { classes: classes.length, students, notes };
}
function listAcademicYears(){
  syncActiveYearStore();
  return Object.keys(DATA.academicYears||{}).sort();
}
function switchActiveYear(year){
  syncActiveYearStore();
  const yd = ensureYearRecord(year);
  DATA.activeYear = year;
  DATA.classes = yd.classes;
  DATA.terms = (yd.terms && yd.terms.length) ? yd.terms : [...DEFAULT_TERMS];
  ensureSchool().year = year;
  ui.term = DATA.terms[0];
  ui.classDetailFor = null;
  ui.adminView = 'paramet';
  ui.teacherView && (ui.teacherView='akey');
}
function createAcademicYear(year){
  syncActiveYearStore();
  ensureYearRecord(year);
}
/* Kopye klas + elèv (san nòt) yon ane sous vè yon ane destinasyon, kòm
   nouvo done ki totalman endepandan (nouvo id pou tout bagay). */
function promoteStudentsToYear(fromYear, toYear){
  syncActiveYearStore();
  const src = (fromYear===DATA.activeYear) ? {classes:DATA.classes} : DATA.academicYears[fromYear];
  if(!src) return 0;
  const dst = ensureYearRecord(toYear);
  let count = 0;
  (src.classes||[]).forEach(c=>{
    const newSubjects = (c.subjects||[]).map(s=>({id:uid(), name:s.name, coef:s.coef, teacherId:s.teacherId||null}));
    const newStudents = (c.students||[]).map(st=>{ count++; return {id:uid(), name:st.name, matricule:st.matricule, sexe:st.sexe, dob:st.dob}; });
    dst.classes.push({ id:uid(), name:c.name, teacherMode:c.teacherMode||'single', teacherId:c.teacherId||null, teacherName:c.teacherName, code:genCode(), subjects:newSubjects, students:newStudents, grades:{} });
  });
  if(toYear===DATA.activeYear) DATA.classes = dst.classes;
  return count;
}

/* ===================== NETTOYAGE / VALIDATION DONE =====================
   Detekte pwoblèm nan done yo (doublon, valè vid, nòt envalid, referans
   ki pa egziste ankò) san janm efase anyen otomatikman. Sèl kalite
   pwoblèm ki ka "korije otomatikman" (apre konfimasyon + backup) se sa
   ki pa gen okenn danje pèt enfòmasyon reyèl: nòt envalid ak referans
   ki pa egziste ankò. Doublon ak valè vid rete yon rapò senp — se
   administratè a ki dwe deside/aji manyèlman pou evite pèdi bon done
   pa aksidan (de moun ka rele menm jan san se pa yon erè). */
function scanDataIssues(){
  syncActiveYearStore();
  const issues = { emptyStudents:[], emptyClasses:[], emptySubjects:[], dupStudents:[], dupClasses:[], dupSubjects:[], invalidGrades:[], danglingGrades:[] };
  Object.keys(DATA.academicYears||{}).forEach(year=>{
    const rec = DATA.academicYears[year] || {};
    const classes = rec.classes || [];
    const seenClassNames = new Map();
    classes.forEach(c=>{
      if(!c.name || !c.name.trim()) issues.emptyClasses.push({year, classId:c.id});
      const ck = normSearch(c.name);
      if(ck){ if(seenClassNames.has(ck)) issues.dupClasses.push({year, classId:c.id, name:c.name}); else seenClassNames.set(ck, c.id); }

      const seenSub = new Map();
      (c.subjects||[]).forEach(s=>{
        if(!s.name || !s.name.trim()) issues.emptySubjects.push({year, className:c.name, subjectId:s.id});
        const sk = normSearch(s.name);
        if(sk){ if(seenSub.has(sk)) issues.dupSubjects.push({year, className:c.name, name:s.name}); else seenSub.set(sk, s.id); }
      });

      const seenStu = new Map();
      (c.students||[]).forEach(st=>{
        if(!st.name || !st.name.trim()) issues.emptyStudents.push({year, className:c.name, studentId:st.id});
        const stk = normSearch(st.name);
        if(stk){ if(seenStu.has(stk)) issues.dupStudents.push({year, className:c.name, name:st.name}); else seenStu.set(stk, st.id); }
      });

      const g = c.grades || {};
      const studentIds = new Set((c.students||[]).map(s=>s.id));
      const subjectMap = new Map((c.subjects||[]).map(s=>[s.id, s]));
      Object.keys(g).forEach(term=>{
        Object.keys(g[term]||{}).forEach(sid=>{
          if(!studentIds.has(sid)){
            issues.danglingGrades.push({year, className:c.name, term, studentId:sid});
            return;
          }
          Object.keys(g[term][sid]||{}).forEach(subId=>{
            const sub = subjectMap.get(subId);
            if(!sub){ issues.danglingGrades.push({year, className:c.name, term, studentId:sid, subjectId:subId}); return; }
            const num = Number(g[term][sid][subId]);
            if(!Number.isFinite(num) || num<0 || num>(sub.coef||1)){
              issues.invalidGrades.push({year, className:c.name, term, studentId:sid, subjectId:subId, subjectName:sub.name});
            }
          });
        });
      });
    });
  });
  return issues;
}
function countIssues(issues){
  return Object.values(issues).reduce((a,arr)=>a+arr.length,0);
}
/* Retire SÈLMAN nòt envalid ak referans ki pa egziste ankò — jamè
   doublon ak jamè non vid, paske sa ka reprezante bon done reyèl. */
function fixSafeDataIssues(){
  syncActiveYearStore();
  let fixed = 0;
  Object.keys(DATA.academicYears||{}).forEach(year=>{
    const classes = (DATA.academicYears[year]||{}).classes || [];
    classes.forEach(c=>{
      const g = c.grades || {};
      const studentIds = new Set((c.students||[]).map(s=>s.id));
      const subjectMap = new Map((c.subjects||[]).map(s=>[s.id, s]));
      Object.keys(g).forEach(term=>{
        Object.keys(g[term]||{}).forEach(sid=>{
          if(!studentIds.has(sid)){ delete g[term][sid]; fixed++; return; }
          Object.keys(g[term][sid]||{}).forEach(subId=>{
            const sub = subjectMap.get(subId);
            if(!sub){ delete g[term][sid][subId]; fixed++; return; }
            const num = Number(g[term][sid][subId]);
            if(!Number.isFinite(num) || num<0 || num>(sub.coef||1)){ delete g[term][sid][subId]; fixed++; }
          });
        });
      });
    });
  });
  if(DATA.activeYear && DATA.academicYears[DATA.activeYear]) DATA.classes = DATA.academicYears[DATA.activeYear].classes;
  return fixed;
}

function findClass(id){ return DATA.classes.find(c=>c.id===id); }
function ensureGradeSlot(cls, term, studentId){
  if(!cls.grades[term]) cls.grades[term] = {};
  if(!cls.grades[term][studentId]) cls.grades[term][studentId] = {};
  return cls.grades[term][studentId];
}
function computeRanking(cls, term){
  const rows = cls.students.map(st=>{
    const g = (cls.grades[term] && cls.grades[term][st.id]) || {};
    let sumPoints=0, sumMax=0, count=0;
    cls.subjects.forEach(sub=>{
      const v = g[sub.id];
      if(v!==undefined && v!=='' && v!==null && !isNaN(v)){
        sumPoints += Number(v); sumMax += (sub.coef||1); count++;
      }
    });
    const avg = sumMax>0 ? (sumPoints/sumMax)*100 : null;
    return {student:st, grades:g, avg, count, sumPoints, sumMax};
  });
  const withAvg = rows.filter(r=>r.avg!==null).sort((a,b)=>b.avg-a.avg);
  const withoutAvg = rows.filter(r=>r.avg===null);
  let rank=0, lastAvg=null, seen=0;
  withAvg.forEach(r=>{ seen++; if(r.avg!==lastAvg){ rank=seen; lastAvg=r.avg; } r.rank=rank; });
  return { ranked:withAvg, unranked:withoutAvg };
}
function computeGradeDistribution(term){
  const buckets = [['90-100',90,100.001],['80-89',80,90],['70-79',70,80],['60-69',60,70],['50-59',50,60],['0-49',0,50]];
  const counts = buckets.map(()=>0);
  let total=0;
  DATA.classes.forEach(c=>{
    const {ranked} = computeRanking(c, term);
    ranked.forEach(r=>{
      total++;
      for(let i=0;i<buckets.length;i++){ if(r.avg>=buckets[i][1] && r.avg<buckets[i][2]){ counts[i]++; break; } }
    });
  });
  const max = Math.max(1, ...counts);
  return buckets.map((b,i)=>({label:b[0], count:counts[i], pct: total? Math.round((counts[i]/max)*100) : 0}));
}

function schoolWideStats(term){
  const nbClasses = DATA.classes.length;
  const nbStudents = DATA.classes.reduce((a,c)=>a+c.students.length,0);
  const teacherSet = new Set();
  DATA.classes.forEach(c=>{
    if(c.teacherId) teacherSet.add(c.teacherId);
    (c.subjects||[]).forEach(s=>{ if(s.teacherId) teacherSet.add(s.teacherId); });
  });
  const subjectSet = new Set();
  DATA.classes.forEach(c=> (c.subjects||[]).forEach(s=>{ const n=(s.name||'').trim().toLowerCase(); if(n) subjectSet.add(n); }));
  let allAvgs = [];
  DATA.classes.forEach(c=>{
    const {ranked} = computeRanking(c, term);
    ranked.forEach(r=> allAvgs.push({name:r.student.name, className:c.name, avg:r.avg}));
  });
  const globalAvg = allAvgs.length ? allAvgs.reduce((a,r)=>a+r.avg,0)/allAvgs.length : null;
  let best = null;
  allAvgs.forEach(r=>{ if(!best || r.avg>best.avg) best=r; });
  const atRisk = allAvgs.filter(r=>r.avg<50).sort((a,b)=>a.avg-b.avg);
  return { nbClasses, nbStudents, nbTeachers:teacherSet.size, nbSubjects:subjectSet.size, globalAvg, best, atRisk, nbGraded: allAvgs.length };

}

function normSearch(s){

function matchSearch(query, haystack){
  const q = normSearch(query);

  const hay = normSearch(haystack);

}

/* ===================== BOOT / RENDER ===================== */
/* ---- Firebase Realtime Database pa estoke tablo/objè vid: lè n li done yo
   ankò, chan tankou "grades", "students", "subjects" (ak "classes" si pa gen
   okenn klas) disparèt (undefined) e sa te fè app la kraze ("Cannot read
   properties of undefined") lè yon klas poko gen nòt, elèv oswa matyè.
   Fonksyon sa a remèt tout chan sa yo apre chak lekti. ---- */
function normalizeLoadedData(d){
  if(!d || typeof d!=='object') return d;
  const arr = v => Array.isArray(v) ? v : (v && typeof v==='object' ? Object.keys(v).map(k=>v[k]) : []);
  const fixClasses = list => list.forEach(c=>{
    if(!c || typeof c!=='object') return;
    c.subjects = arr(c.subjects);
    c.students = arr(c.students);
    if(!c.grades || typeof c.grades!=='object') c.grades = {};
  });
  d.admins = arr(d.admins);
  d.classes = arr(d.classes);
  d.terms = arr(d.terms);
  fixClasses(d.classes);
  if(d.academicYears && typeof d.academicYears==='object'){
    Object.keys(d.academicYears).forEach(y=>{
      const yd = d.academicYears[y];
      if(!yd || typeof yd!=='object'){ d.academicYears[y] = { classes:[], terms:[] }; return; }
      yd.classes = arr(yd.classes);
      yd.terms = arr(yd.terms);
      fixClasses(yd.classes);
    });
  }
  return d;
}
async function boot(){

     nou eseye li done yo — Realtime Database a mande yon sesyon valab. */

         sistèm "plizyè lekòl" la te egziste) — li dwe rete lye ak lekòl
         prensipal la san okenn friksyon. */
      setSchoolId('');

         (ak omwen yon administratè) sou chemen prensipal "schoolData" la,
         nou pa dwe rejwenn li otomatikman san pèmisyon — yon moun ki resevwa
         menm fichye a pa ta dwe tonbe san l pa konnen sou done yon lòt
         enstitisyon. Nou mande yo chwazi eksplisitman. */
      const legacy = await loadDataAtPath('schoolData');
      const legacyHasAdmins = !!(legacy && Array.isArray(legacy.admins) && legacy.admins.some(a=>a.uid));
      if(legacyHasAdmins){

        render('schoolgate');
        return;

      /* Anyen pa konfigire ankò — se aparèy sa a k ap vin premye a. */
      setSchoolId('');
    }
  }
  const loaded = await loadData();
  DATA = loaded || { schoolName:'', crestCode:'', admins:[], classes:[], terms:[...DEFAULT_TERMS] };
  normalizeLoadedData(DATA);
  if(!DATA.terms || DATA.terms.length===0) DATA.terms=[...DEFAULT_TERMS];

  migrateAcademicYears();
  migrateTeacherProfiles();
  ui.term = DATA.terms[0];
  const mode = await loadAppearance();
  applyAppearance(mode);
  ui.appearance = mode;
  const navMode = await loadNavStyle();
  applyNavStyle(navMode);
  ui.navStyle = navMode;
  ui.notifDesktop = await loadNotifPref();
  /* Si yon vrè kont administratè (non anonim) toujou konekte nan Firebase
     (paj la fèk aktyalize), rekonekte sesyon an otomatikman san l pa
     bezwen re-antre modpas li. */
  let restored = false;
  if(FIREBASE_ENABLED && fbAuth && fbAuth.currentUser && !fbAuth.currentUser.isAnonymous){
    let rec = (DATA.admins||[]).find(a=>a.uid===fbAuth.currentUser.uid);
    if(!rec){
      const switched = await switchToSchoolForUid(fbAuth.currentUser.uid);
      if(switched) rec = (DATA.admins||[]).find(a=>a.uid===fbAuth.currentUser.uid);
    }
    if(rec){
      session = {role:'admin', classId:null, teacherId:null, adminUsername:rec.username};
      ui.adminView='akey';
      restored = true;
      recordAdminSchool(fbAuth.currentUser.uid);
    }
  }
  render(restored ? 'admin' : 'login');
}
function render(view){
  const app = document.getElementById('app');
  if(view==='login') app.innerHTML = viewLogin();
  else if(view==='schoolgate') app.innerHTML = viewSchoolGate();
  else if(view==='admin') app.innerHTML = viewAdmin();
  else if(view==='teacher') app.innerHTML = viewTeacher();
  wireEvents(view);
  if(view==='admin' || view==='teacher') startMessageNotifications(view);
  else stopMessageNotifications();
  /* Balans & Peman — chak fonksyon la pwoteje pa try/catch: yon erè isit la pa dwe kraze afichaj app la */
  try{
    if(view==='admin') startWalletWatch(); else stopWalletWatch();
    walletUpdateBadge();
    decoratePaidOptions();
    decoratePreviewWatermark();
  }catch(e){ console.error('Balans/Peman', e); }
}

function histogramHtml(dist){
  if(dist.every(d=>d.count===0)) return `<div class="empty-state">Poko gen mwayèn kalkile pou trimès sa a.</div>`;
  return dist.map(d=>`
    <div class="hist-row">
      <div class="hist-label">${d.label}</div>
      <div class="hist-track"><div class="hist-fill" style="width:${d.pct}%"></div></div>
      <div class="hist-count">${d.count}</div>
    </div>`).join('');
}

function adminMessages(){
  const teachers = teachersForMessaging().sort((a,b)=>{
    const la = teacherMessagesList(a.id).slice(-1)[0], lb = teacherMessagesList(b.id).slice(-1)[0];
    if(la && lb) return lb.ts - la.ts;
    if(la) return -1;
    if(lb) return 1;
    return teacherDisplayName(a).localeCompare(teacherDisplayName(b));
  });
  if(ui.msgTeacherId===undefined) ui.msgTeacherId=null;
  const isNarrow = window.innerWidth <= 900;
  const selected = findTeacherById(ui.msgTeacherId);
  const list = teachers.map(t=>{
    const unread = unreadFromTeacher(t.id);
    const last = lastVisibleMessage(t.id, 'admin');
    const lastLabel = !last ? escapeHtml(teacherAssignmentsLabel(t.id))
      : last.deletedForEveryone ? 'Ce message a été supprimé pour tout le monde.'
      : escapeHtml((last.sender==='admin'?'Ou: ':'')+(last.text||'').slice(0,32));
    return `<button type="button" class="msg-convo-item ${t.id===ui.msgTeacherId?'active':''} ${unread>0?'unread':''}" data-msg-teacher="${t.id}">
      <div class="msg-avatar" style="background:${colorFor(teacherDisplayName(t))}">${t.photo? `<img src="${t.photo}" style="width:100%;height:100%;object-fit:cover">` : initialsOf(teacherDisplayName(t))}</div>
      <div style="flex:1;min-width:0">
        <div class="nm">${escapeHtml(teacherDisplayName(t))}</div>
        <div class="sub">${lastLabel}</div>
      </div>
      ${unread>0?`<span class="sb-badge">${unread>9?'9+':unread}</span>`:''}
    </button>`;
  }).join('');
  const thread = ui.msgShowProfile && selected ? adminTeacherProfileView(selected)
    : selected ? adminMessageThread(selected)
    : `<div class="empty-state">Chwazi yon pwofesè pou wè konvèsasyon an.</div>`;
  return `
  <div class="page-head">
    <h1 class="page-title">Messages</h1>
    <p class="page-sub">Kominike ak pwofesè yo — chak pwofesè se yon sèl konvèsasyon, menm si li anseye plizyè klas.</p>
  </div>
  <div class="msg-layout ${selected&&isNarrow?'has-open':''}">
    <div class="msg-convo-list">${list || '<div class="empty-state">Pa gen pwofesè ankò.</div>'}</div>
    <div class="msg-thread">${thread}</div>
  </div>`;
}

function dataCleanupHtml(){
  const iss = scanDataIssues();
  const total = countIssues(iss);
  const sample = (arr, fmt, n=5) => arr.slice(0,n).map(fmt).join(', ') + (arr.length>n? ` … (+${arr.length-n} lòt)` : '');
  const row = (label, arr, fmt) => arr.length ? `<tr><td>${label}</td><td style="color:var(--red);font-weight:700">${arr.length}</td><td style="color:var(--text-soft);font-size:12.5px">${escapeHtml(sample(arr, fmt))}</td></tr>` : '';
  const rows = [
    row('Klas ki pòko gen non', iss.emptyClasses, i=>`ane ${i.year}`),
    row('Elèv ki pòko gen non', iss.emptyStudents, i=>`${i.className} (${i.year})`),
    row('Matyè ki pòko gen non', iss.emptySubjects, i=>`${i.className} (${i.year})`),
    row('Klas ak menm non (menm ane)', iss.dupClasses, i=>`"${i.name}" (${i.year})`),
    row('Elèv ki sanble doublon', iss.dupStudents, i=>`"${i.name}" nan ${i.className} (${i.year})`),
    row('Matyè ki sanble doublon', iss.dupSubjects, i=>`"${i.name}" nan ${i.className} (${i.year})`),
    row('Nòt envalid (negatif/pi gran pase barèm)', iss.invalidGrades, i=>`${i.subjectName||'?'} — ${i.className} (${i.year})`),
    row('Referans ki pa egziste ankò', iss.danglingGrades, i=>`${i.className} (${i.year})`)
  ].filter(Boolean).join('');
  const autoFixCount = iss.invalidGrades.length + iss.danglingGrades.length;
  return `
  <div class="card">
    <div class="card-head"><span class="ic-wrap">${ICONS.flag}</span><h3>Netwayaj & validation done</h3></div>
    ${total===0
      ? `<div class="empty-state">Okenn pwoblèm detekte nan done yo. Bravo!</div>`
      : `<table><tbody>${rows}</tbody></table>
         <p class="hint" style="text-align:left">Doublon ak non vid pa efase otomatikman — ou dwe verifye epi aji manyèlman (efase/korije) nan Klas yo, paske de moun ka rele menm jan san se pa yon vrè erè. ${autoFixCount>0? `Pou "Nòt envalid" ak "Referans ki pa egziste ankò" (${autoFixCount} antre), yo san danje pou retire otomatikman.` : ''}</p>
         ${autoFixCount>0 ? `<button class="btn btn-primary btn-pill" id="auto-fix-issues" type="button">Telechaje backup epi korije ${autoFixCount} pwoblèm san danje</button>` : ''}`}
  </div>`;
}

/* ===================== BALANS & PEMAN (NatCash) =====================
   Sistèm balans prepeye. Tout done yo nan NOUVO nœud Firebase (pa touche
   schoolData): wallets/{uid}/credits (ajoute pa pwopriyetè a sèlman),
   wallets/{uid}/spends (itilizatè a ajoute, pa efase), paymentRequests/{uid}/{id}.
   Balans = total credits - total spends. */
const OWNER_EMAIL = 'medawilgens24@gmail.com';
const NATCASH_RAW = '+50943011194';
const NATCASH_DISPLAY = '+509 4301 1194';
const PRICES = { doc:2.5, bulletin:5, palmares:15, fontDay:10 };
/* Gratis = premye yo nan lis la. Chanje lis sa yo si w vle chanje sa ki gratis.
   bulletinStyles = peman ENDIVIDYÈL (chak bilten se pou 1 sèl elèv).
   palmaresStyles = peman KOLEKTIF (yon sèl peman kouvri tout klas la, tout elèv). */
const FREE = { docTemplates:['classic','elegant','modern'], bulletinStyles:['classic','elegant'], palmaresStyles:['classic','elegant'], fonts:['serif-classic','serif-elegant'] };
const MIN_TOPUP = 25;
const TOPUP_CHOICES = [25,50,100,200];
const WALLET = { uid:null, loaded:false, error:null, balance:0, fontPassUntil:0, reqs:[], ref:null, handler:null, reqRef:null, reqHandler:null, reqStatus:null };
const OWNER = { ref:null, handler:null, list:[], known:null };
let SERVER_OFFSET = 0, _offsetRef = null;

function fmtG(n){ return String(Math.round((Number(n)||0)*100)/100).replace('.',','); }
function nowServer(){ return Date.now() + SERVER_OFFSET; }
function serverTs(){ return firebase.database.ServerValue.TIMESTAMP; }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('delè depase')), ms))]); }
function isOwner(){
  const u = (typeof fbAuth!=='undefined' && fbAuth) ? fbAuth.currentUser : null;
  return !!(u && !u.isAnonymous && String(u.email||'').toLowerCase()===OWNER_EMAIL);
}
function walletRecompute(v){
  let cr=0, sp=0, pass=0;
  const credits = (v && v.credits) || {}, spends = (v && v.spends) || {};
  Object.keys(credits).forEach(k=>{ const c=credits[k]; if(c) cr += Number(c.amount)||0; });
  Object.keys(spends).forEach(k=>{
    const x=spends[k]; if(!x) return;
    sp += Number(x.amount)||0;
    if(x.kind==='fontpass') pass = Math.max(pass, (Number(x.ts)||0) + 86400000);
  });
  WALLET.balance = Math.round((cr-sp)*100)/100;
  WALLET.fontPassUntil = pass;
}
function walletFontPassActive(){ return WALLET.fontPassUntil > nowServer(); }
function ownerFlatten(v){
  const out=[];
  Object.keys(v||{}).forEach(uid=>{
    const m = v[uid]||{};
    Object.keys(m).forEach(id=>{ const r=m[id]; if(r && typeof r==='object') out.push(Object.assign({uid, id}, r)); });
  });
  out.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return out;
}
function ownerPendingCount(){ return OWNER.list.filter(r=>r.status==='pending').length; }
function walletUpdateBadge(){
  const b = document.getElementById('wal-badge');
  if(!b) return;
  const n = isOwner() ? ownerPendingCount() : 0;
  if(n>0){ b.textContent = n>9?'9+':String(n); b.style.display='flex'; } else { b.style.display='none'; }
}
function walletRefreshUI(){
  try{
    walletUpdateBadge();
    decoratePreviewWatermark();
    if(session && session.role==='admin' && (ui.adminView==='wal' || ui.adminView==='pwo')){
      const ae = document.activeElement;
      if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
      render('admin');
    }
  }catch(e){ console.error(e); }
}
function startWalletWatch(){
  const u = (FIREBASE_ENABLED && fbAuth && fbDb) ? fbAuth.currentUser : null;
  if(!u || u.isAnonymous){ stopWalletWatch(); return; }
  if(!(WALLET.uid===u.uid && WALLET.ref)){
    stopWalletWatch();
    WALLET.uid = u.uid;
    try{
      _offsetRef = fbDb.ref('.info/serverTimeOffset');
      _offsetRef.on('value', sn=>{ SERVER_OFFSET = Number(sn.val())||0; });
      WALLET.ref = fbDb.ref('wallets/'+u.uid);
      WALLET.handler = snap=>{ walletRecompute(snap.val()||{}); WALLET.loaded=true; WALLET.error=null; walletRefreshUI(); };
      WALLET.ref.on('value', WALLET.handler, err=>{ WALLET.error = (err && err.code) || 'erè'; WALLET.loaded=true; walletRefreshUI(); });
      WALLET.reqRef = fbDb.ref('paymentRequests/'+u.uid);
      WALLET.reqHandler = snap=>{
        const v = snap.val()||{};
        const list = Object.keys(v).map(id=>Object.assign({id, uid:u.uid}, v[id])).filter(r=>r && typeof r==='object').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
        if(WALLET.reqStatus){
          list.forEach(r=>{
            if(WALLET.reqStatus[r.id]==='pending' && r.status==='verified'){
              playNotifSound();
              showToast({title:'Peman verifye', message:'+'+fmtG(r.amount)+' G ajoute sou balans ou.'});
            }
          });
        }
        WALLET.reqStatus = {}; list.forEach(r=>{ WALLET.reqStatus[r.id]=r.status; });
        WALLET.reqs = list;
        walletRefreshUI();
      };
      WALLET.reqRef.on('value', WALLET.reqHandler, ()=>{});
    }catch(e){ console.error('Wallet watch', e); }
  }
  if(isOwner()) startOwnerWatch(); else stopOwnerWatch();
}
function stopWalletWatch(){
  try{ if(WALLET.ref && WALLET.handler) WALLET.ref.off('value', WALLET.handler); }catch(e){}
  try{ if(WALLET.reqRef && WALLET.reqHandler) WALLET.reqRef.off('value', WALLET.reqHandler); }catch(e){}
  try{ if(_offsetRef) _offsetRef.off(); }catch(e){}
  WALLET.uid=null; WALLET.ref=null; WALLET.handler=null; WALLET.reqRef=null; WALLET.reqHandler=null;
  WALLET.reqStatus=null; WALLET.loaded=false; WALLET.error=null; WALLET.balance=0; WALLET.fontPassUntil=0; WALLET.reqs=[];
  _offsetRef = null;
  stopOwnerWatch();
}
function startOwnerWatch(){
  if(OWNER.ref) return;
  try{
    OWNER.ref = fbDb.ref('paymentRequests');
    OWNER.handler = snap=>{
      const list = ownerFlatten(snap.val());
      if(OWNER.known){
        list.forEach(r=>{
          if(r.status==='pending' && !OWNER.known[r.id]){
            playNotifSound();
            showToast({title:'Nouvo peman', message:(r.name||r.email||'Itilizatè')+' — '+fmtG(r.amount)+' G', onClick:()=>{ ui.adminView='wal'; ui.walOwner=true; render('admin'); }});
          }
        });
      }
      OWNER.known = {}; list.forEach(r=>{ OWNER.known[r.id]=1; });
      OWNER.list = list;
      walletRefreshUI();
    };
    OWNER.ref.on('value', OWNER.handler, ()=>{});
  }catch(e){ console.error('Owner watch', e); }
}
function stopOwnerWatch(){
  try{ if(OWNER.ref && OWNER.handler) OWNER.ref.off('value', OWNER.handler); }catch(e){}
  OWNER.ref=null; OWNER.handler=null; OWNER.list=[]; OWNER.known=null;
}
async function walletEnsureLoaded(){
  for(let i=0; i<40 && !WALLET.loaded; i++){ await new Promise(r=>setTimeout(r,100)); }
}
async function walletSpend(kind, amount){
  const ref = fbDb.ref('wallets/'+WALLET.uid+'/spends').push();
  await withTimeout(ref.set({ kind, amount, ts: serverTs() }), 9000);
}
function paidNeeds(o){
  const needs=[];
  if(o.docTemplate && !FREE.docTemplates.includes(o.docTemplate)) needs.push({kind:'doc', amount:PRICES.doc, label:'Modèl dokiman premium'});
  if(o.bulletinStyle && !FREE.bulletinStyles.includes(o.bulletinStyle)) needs.push({kind:'bulletin', amount:PRICES.bulletin, label:'Estil bilten premium (1 elèv)'});
  if(o.palmaresStyle && !FREE.palmaresStyles.includes(o.palmaresStyle)) needs.push({kind:'palmares', amount:PRICES.palmares, label:'Estil palmarès premium (tout klas la)'});
  if(o.docFont && !FREE.fonts.includes(o.docFont) && !walletFontPassActive()) needs.push({kind:'fontpass', amount:PRICES.fontDay, label:'Estil ekriti premium (aksè 24è)'});
  return needs;
}
function isPremiumSel(o){
  return !!((o.docTemplate && !FREE.docTemplates.includes(o.docTemplate)) || (o.bulletinStyle && !FREE.bulletinStyles.includes(o.bulletinStyle)) || (o.palmaresStyle && !FREE.palmaresStyles.includes(o.palmaresStyle)) || (o.docFont && !FREE.fonts.includes(o.docFont)));
}
/* Kouri fn() (enprime a) apre verifikasyon peman an. Lè pa gen anyen pou peye
   (estil gratis, pwopriyetè, oswa pas 24è aktif), fn() kouri IMEDYATMAN nan menm klik la,
   san okenn await — konsa enpresyon an konpòte l egzakteman kòm nan fichye orijinal la. */
function paidThen(o, fn){
  try{
    if(isOwner() || !isPremiumSel(o)){ fn(); return; }
    if(session && session.role==='admin' && WALLET.loaded && !WALLET.error && paidNeeds(o).length===0){ fn(); return; }
  }catch(e){ console.error('paidThen', e); }
  ensurePaid(o).then(ok=>{ if(ok) fn(); }).catch(e=>console.error('paidThen', e));
}
/* Retounen true si w gen dwa kontinye (gratis, oswa peye ak balans lan). */
async function ensurePaid(o){
  if(isOwner()) return true;
  const premium = (o.docTemplate && !FREE.docTemplates.includes(o.docTemplate)) || (o.bulletinStyle && !FREE.bulletinStyles.includes(o.bulletinStyle)) || (o.palmaresStyle && !FREE.palmaresStyles.includes(o.palmaresStyle)) || (o.docFont && !FREE.fonts.includes(o.docFont));
  if(!premium) return true;
  if(!session || session.role!=='admin'){
    await showAlert('Estil sa a se yon fonksyon peye. Chwazi yon estil gratis, oswa mande administratè a pou l itilize l.');
    return false;
  }
  if(!FIREBASE_ENABLED || !fbDb || !WALLET.uid){
    await showAlert('Ou dwe konekte ak kont administratè w pou itilize fonksyon peye yo.');
    return false;
  }
  if(!navigator.onLine){ await showAlert('Ou bezwen entènèt pou itilize fonksyon peye yo.'); return false; }
  await walletEnsureLoaded();
  if(WALLET.error){ await showAlert('Pa ka li balans ou kounye a ('+WALLET.error+'). Eseye ankò pita.'); return false; }
  const needs = paidNeeds(o);
  if(!needs.length) return true;
  const total = needs.reduce((a,n)=>a+n.amount, 0);
  const lines = needs.map(n=>'• '+n.label+' : '+fmtG(n.amount)+' G').join('\n');
  if(WALLET.balance < total){
    const go = await showConfirm('Fonksyon sa a peye.\n\n'+lines+'\nTotal : '+fmtG(total)+' G\nBalans ou : '+fmtG(WALLET.balance)+' G\n\nPou ajoute lajan, voye l sou NatCash '+NATCASH_DISPLAY+' epi soumèt kòd tranzaksyon an. Ale sou paj peman an?', {okLabel:'Ajoute lajan', title:'Balans ensifizan'});
    if(go){ ui.adminView='wal'; ui.walOwner=false; render('admin'); }
    return false;
  }
  const ok = await showConfirm(lines+'\nTotal : '+fmtG(total)+' G\n\nBalans : '+fmtG(WALLET.balance)+' G → '+fmtG(WALLET.balance-total)+' G\n\nKonfime peman an?', {okLabel:'Peye '+fmtG(total)+' G', title:'Fonksyon peye'});
  if(!ok) return false;
  try{
    for(const n of needs){ await walletSpend(n.kind, n.amount); }
  }catch(e){
    await showAlert('Peman an pa pase ('+((e && e.message)||'erè')+'). Verifye entènèt ou epi eseye ankò.');
    return false;
  }
  await showAlert('Peman fèt. Peze OK pou kontinye ak enpresyon an.');
  return true;
}
/* Mete pri a bò kote opsyon premium yo nan lis chwa yo (san chanje rès UI a). */
function decoratePaidOptions(){
  const mark = (sel, freeIds, price)=>{
    document.querySelectorAll(sel+' option').forEach(o=>{
      if(o.dataset.paidMarked) return;
      if(!freeIds.includes(o.value)) o.textContent += '  ·  ' + price;
      o.dataset.paidMarked = '1';
    });
  };
  mark('#doc-template-select', FREE.docTemplates, fmtG(PRICES.doc)+' G');
  mark('#doc-font-select', FREE.fonts, fmtG(PRICES.fontDay)+' G/jou');
  mark('select[data-print-style-key="bulletin"]', FREE.bulletinStyles, fmtG(PRICES.bulletin)+' G/elèv');
  mark('select[data-print-style-key="palmares"]', FREE.palmaresStyles, fmtG(PRICES.palmares)+' G/klas');
}
/* Apèsi dokiman premium ki pa peye toujou gen yon filigran repete sou tout paj la,
   pou yon screenshot pa ka ranplase peman an. Filigran an pa parèt sou dokiman
   ou enprime a (enprime a soti nan #print-area, pa nan apèsi a).
   Chak zòn apèsi (dokiman, bilten, palmarès) mete pwòp bezwen peman li nan
   atribi data-wm-obj (JSON), konsa yon sèl fonksyon jenerik ka jere yo tout. */
function decoratePreviewWatermark(){
  const box = document.querySelector('.doc-preview-scroll');
  if(!box || !box.parentNode) return;
  let wmObj = {};
  try{ wmObj = JSON.parse(box.getAttribute('data-wm-obj')||'null') || {docTemplate:ui.docsTemplate, docFont:ui.docsFont}; }catch(e){ wmObj = {docTemplate:ui.docsTemplate, docFont:ui.docsFont}; }
  const locked = !isOwner() && paidNeeds(wmObj).length>0;
  let wrap = (box.parentNode.classList && box.parentNode.classList.contains('wm-wrap')) ? box.parentNode : null;
  if(locked && !wrap){
    wrap = document.createElement('div'); wrap.className = 'wm-wrap';
    const note = document.createElement('div'); note.className = 'wm-note';
    note.textContent = 'Apèsi premium — filigran an pa parèt sou dokiman ou enprime a apre w fin peye.';
    const ov = document.createElement('div'); ov.className = 'wm-overlay';
    box.parentNode.insertBefore(note, box);
    box.parentNode.insertBefore(wrap, box);
    wrap.appendChild(box); wrap.appendChild(ov);
  } else if(!locked && wrap){
    const parent = wrap.parentNode;
    const prev = wrap.previousSibling;
    if(prev && prev.classList && prev.classList.contains('wm-note')) parent.removeChild(prev);
    parent.insertBefore(box, wrap);
    parent.removeChild(wrap);
  }
}

/* Konpare kòd SMS NatCash la ak tout demann ki soumèt nan app la (OWNER.list
   gen tout demann, pa sèlman 20 dènye yo). Match egzat parèt an premye,
   answit match pasyèl (an ka gen yon ti erè tape). Si okenn match, avèti
   pwopriyetè a se ka yon fo kòd. */
function ownerSearchMatchHtml(code){
  const q = String(code||'').trim().toUpperCase();
  if(!q) return `<p class="hint" style="text-align:left">Antre kòd la pou konpare l ak demann ki nan app la.</p>`;
  const exact = OWNER.list.filter(r=>String(r.txid||'').toUpperCase().trim()===q);
  const partial = OWNER.list.filter(r=>{
    const t = String(r.txid||'').toUpperCase();
    return t!==q && t.includes(q);
  });
  if(!exact.length && !partial.length){
    return `<div class="wal-warn">⚠ Okenn demann nan app la pa gen kòd sa a. Si yon moun di li voye lajan ak kòd sa a, sa ka vle di se yon <b>FO KÒD</b> — pa verifye/aksepte okenn peman san w pa jwenn kòd egzat la nan lis anba a.</div>`;
  }
  const miniRow = (r)=>{
    const dup = OWNER.list.filter(x=>x.id!==r.id && x.status!=='rejected' && String(x.txid||'').toUpperCase()===String(r.txid||'').toUpperCase());
    return `
    <div class="wal-req">
      <div class="wal-req-top"><b>${fmtG(r.amount)} G</b><span class="wal-st wal-st-${escapeHtml(r.status||'pending')}">${walStatusLabel(r.status)}</span></div>
      <div>${escapeHtml(r.name||'')}${r.email?' · '+escapeHtml(r.email):''}</div>
      <div>Kòd nan app la : <b>${escapeHtml(r.txid||'')}</b> · Nimewo : ${escapeHtml(r.phone||'')}</div>
      <div class="hint" style="text-align:left;margin:4px 0 0">${escapeHtml(walDate(r.createdAt))}</div>
      ${r.status==='verified' ? '<div class="wal-sub" style="color:#1a7f37;font-weight:600">✓ Peman sa a deja verifye — konpare byen non/montan ak SMS ou a; menm kòd la pa dwe sèvi de fwa.</div>' : ''}
      ${r.status==='rejected' ? `<div class="hint" style="text-align:left">Demann sa a te rejte${r.reason?' — '+escapeHtml(r.reason):''}.</div>` : ''}
      ${dup.length>0 ? '<div class="wal-warn">⚠ Menm kòd sa a parèt sou plizyè demann — konpare non ak nimewo a byen anvan w verifye.</div>' : ''}
    </div>`;
  };
  return `
    ${exact.length ? `<div class="hint" style="text-align:left;color:#1a7f37;font-weight:600">✓ Kòd la jwenn nan app la (${exact.length}) :</div>${exact.map(miniRow).join('')}` : `<div class="wal-warn">⚠ Okenn match egzat pou kòd sa a — gade rezilta pwòch anba a, ou byen se ka yon fo kòd.</div>`}
    ${partial.length ? `<div class="hint" style="text-align:left;margin-top:${exact.length?'12px':'8px'}">Rezilta pwòch (pa yon match 100%) :</div>${partial.map(miniRow).join('')}` : ''}
  `;
}
async function ownerVerify(uid, id){
  const r = OWNER.list.find(x=>x.uid===uid && x.id===id);
  if(!r || r.status!=='pending') return;
  const dup = OWNER.list.find(x=>x.id!==id && x.status==='verified' && String(x.txid||'').toUpperCase()===String(r.txid||'').toUpperCase());
  const msg = 'Ajoute '+fmtG(r.amount)+' G sou kont '+(r.name||r.email||uid)+' ?\nKòd : '+r.txid+'\nNimewo : '+(r.phone||'')+(dup?'\n\n⚠ Kòd sa a deja itilize nan yon lòt peman verifye!':'');
  if(!await showConfirm(msg, {okLabel:'Verifye', title:'Verifye peman', danger:!!dup})) return;
  const me = fbAuth.currentUser;
  const up = {};
  up['wallets/'+uid+'/credits/'+id] = { amount:Number(r.amount), ts:serverTs(), by:me.uid, req:id };
  up['paymentRequests/'+uid+'/'+id+'/status'] = 'verified';
  up['paymentRequests/'+uid+'/'+id+'/verifiedAt'] = serverTs();
  try{ await withTimeout(fbDb.ref().update(up), 9000); }
  catch(e){ await showAlert('Pa t kapab verifye ('+((e&&e.message)||'erè')+'). Eseye ankò.'); }
}
async function ownerReject(uid, id){
  const r = OWNER.list.find(x=>x.uid===uid && x.id===id);
  if(!r || r.status!=='pending') return;
  const reason = await showPrompt('Rejte peman '+fmtG(r.amount)+' G sa a ? Ekri yon rezon (opsyonèl) epi konfime:', '');
  if(reason===null) return;
  try{ await withTimeout(fbDb.ref('paymentRequests/'+uid+'/'+id).update({status:'rejected', reason:String(reason).trim().slice(0,120), verifiedAt:serverTs()}), 9000); }
  catch(e){ await showAlert('Pa t kapab rejte ('+((e&&e.message)||'erè')+').'); }
}
/* Efase yon sèl demann nan istorik la (verifye oswa rejte). Sa retire l
   sèlman nan lis "paymentRequests" — si peman an te deja verifye, balans
   itilizatè a (wallets/{uid}/credits) rete entak, se jis antre istorik
   la k ap disparèt. */
async function ownerDeleteOne(uid, id){
  const r = OWNER.list.find(x=>x.uid===uid && x.id===id);
  if(!r) return;
  if(!await showConfirm('Efase demann '+fmtG(r.amount)+' G sa a nan istorik la? Sa PAP retire okenn lajan sou balans itilizatè a si peman an te deja verifye — se jis lis istorik la.', {danger:true, okLabel:'Wi, efase l'})) return;
  try{ await withTimeout(fbDb.ref('paymentRequests/'+uid+'/'+id).remove(), 9000); }
  catch(e){ await showAlert('Pa t kapab efase demann sa a ('+((e&&e.message)||'erè')+').'); }
}
/* Efase ANNANTYE istorik demann yo (tout sa ki verifye oswa rejte, pa
   sèlman 20 ki afiche yo) — pa touche demann ki an atant, ni balans
   itilizatè yo. Aksyon sa a pa ka anile. */
async function ownerClearHistory(){
  const items = OWNER.list.filter(r=>r.status!=='pending');
  if(!items.length){ await showAlert('Pa gen okenn istorik pou efase.'); return; }
  if(!await showConfirm('Efase TOUT '+items.length+' demann ki nan istorik la (verifye + rejte)? Sa PAP touche balans itilizatè yo ni demann ki an atant — se jis lis istorik la k ap disparèt nèt. Aksyon sa a pa ka anile.', {danger:true, okLabel:'Wi, efase tout istorik la'})) return;
  const up = {};
  items.forEach(r=>{ up['paymentRequests/'+r.uid+'/'+r.id] = null; });
  try{
    await withTimeout(fbDb.ref().update(up), 9000);
    showToast({title:'Istorik efase', message:items.length+' demann retire nan istorik la.'});
  }catch(e){ await showAlert('Pa t kapab efase istorik la ('+((e&&e.message)||'erè')+').'); }
}

  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}

/* ===================== VIEW: TEACHER ===================== */
function viewTeacher(){
  const teacher = findTeacherById(session.teacherId);
  if(!teacher){
    session = {role:null, classId:null, teacherId:null, adminUsername:null};
    setTimeout(async ()=>{ await showAlert('Kont pwofesè sa a pa egziste ankò — administratè lekòl la efase l.'); render('login'); }, 0);
    return `<div class="empty-state">Rekoneksyon...</div>`;
  }
  const myClasses = classesForTeacher(teacher.id);
  if(!session.classId || !myClasses.some(c=>c.id===session.classId)) session.classId = myClasses[0] ? myClasses[0].id : null;
  const cls = session.classId ? findClass(session.classId) : null;
  const unread = unreadFromAdmin(teacher.id);
  let body;
  if(ui.teacherView==='mesaj') body = teacherMessages(teacher);
  else if(ui.teacherView==='pwofil') body = teacherProfileView(teacher);
  else if(ui.teacherView==='akey') body = teacherHome(teacher, myClasses);
  else body = cls ? classManager(cls,'teacher') : `<div class="empty-state">Ou pa gen okenn klas ki asiyen pou kounye a. Mande administratè lekòl la pou l ajoute w nan yon klas.</div>`;
  const subLabel = myClasses.length>1 ? `Pwofesè · ${myClasses.length} klas` : (cls? 'Pwofesè · '+cls.name : 'Pwofesè');
  return `
  ${navBar('teacher', ui.teacherView, initialsOf(teacherDisplayName(teacher)||'Pwofesè'), teacher.photo, unread)}
  <div class="fb-body">
    ${sidebarShortcuts('teacher', ui.teacherView, teacherDisplayName(teacher)||'Pwofesè', subLabel, teacher.photo, unread)}
    <div class="fb-main">${body}</div>
  </div>
  ${bottomNavBar('teacher', ui.teacherView, unread)}`;
}

function teacherHome(teacher, myClasses){
  const list = myClasses || classesForTeacher(teacher.id);
  return `
  <div class="page-head">
    <h1 class="page-title">Byenveni, ${escapeHtml(teacherDisplayName(teacher))}</h1>
    <p class="page-sub">Kòd koneksyon ou: <span class="code-chip">${teacher.code}</span> — pa pataje l ak lòt moun. Yon sèl kòd ba w aksè a tout klas ou yo.</p>
  </div>
  <div class="stat-row">
    <div class="stat-box"><div class="stat-ic">${ICONS.grid}</div><div class="num">${list.length}</div><div class="lbl">Klas</div></div>
    <div class="stat-box"><div class="stat-ic">${ICONS.users}</div><div class="num">${list.reduce((a,c)=>a+c.students.length,0)}</div><div class="lbl">Elèv</div></div>

        return `<tr><td><strong>${escapeHtml(c.name)}</strong>${subs?` <span style="color:var(--text-soft);font-size:12.5px">— ${escapeHtml(subs)}</span>`:''}</td>

/* ===================== CLASS MANAGER ===================== */
function classManager(cls, role){
  const tab = ui.classTab || 'eleve';
  let inner='';
  if(tab==='eleve') inner = tabStudents(cls);
  else if(tab==='matye') inner = tabSubjects(cls, role);
  else if(tab==='note') inner = tabGrades(cls, role);
  else if(tab==='palmares') inner = tabPalmares(cls);
  else if(tab==='fich') inner = tabFiche(cls);
  else if(tab==='ore') inner = tabSchedule(cls);

  return `
  <div class="page-head">
    ${role==='admin' ? `<a id="back-to-classes" style="cursor:pointer;font-size:13px;color:var(--blue);font-weight:700;">← Klas yo</a>`:''}
    ${role==='teacher' && classesForTeacher(session.teacherId).length>1 ? `<a id="back-to-teacher-home" style="cursor:pointer;font-size:13px;color:var(--blue);font-weight:700;">← Klas mwen</a>` : ''}
    <h1 class="page-title" style="margin-top:6px">${escapeHtml(cls.name)}</h1>
    <p class="page-sub">Pwofesè: ${escapeHtml(classTeacherLabel(cls))}${(role==='admin' && cls.teacherMode!=='multiple' && cls.teacherId) ? ` · Kòd koneksyon pwofesè a: <span class="code-chip">${(findTeacherById(cls.teacherId)||{}).code||'—'}</span>` : ''} · Kòd klas (referans): <span class="code-chip">${cls.code}</span></p>
  </div>
  <div class="tab-strip">
    <button class="tab-btn ${tab==='eleve'?'active':''}" data-ctab="eleve">${ICONS.users}Elèv</button>
    <button class="tab-btn ${tab==='matye'?'active':''}" data-ctab="matye">${ICONS.book}Matyè & Barèm</button>
    <button class="tab-btn ${tab==='note'?'active':''}" data-ctab="note">${ICONS.pencil}Nòt</button>
    <button class="tab-btn ${tab==='palmares'?'active':''}" data-ctab="palmares">${ICONS.trophy}Palmarès & Bilten</button>
    <button class="tab-btn ${tab==='fich'?'active':''}" data-ctab="fich">${ICONS.idcard}Fich elèv</button>
    <button class="tab-btn ${tab==='ore'?'active':''}" data-ctab="ore">${ICONS.calendar}Orè</button>
  </div>
  ${inner}`;
}

    : `<span class="avatar" style="background:${colorFor(s.name)}">${initialsOf(s.name)}</span>`;
  return `<div class="person">${av}<div><span class="name-cell-txt">${escapeHtml(s.name)}</span>${sub}</div></div>`;
}

      <div class="field" style="max-width:170px"><label>Dat nesans (opsyonèl)</label><input id="ns-dob" type="date"></div>
      <button class="btn btn-primary btn-pill" type="submit">Ajoute</button>
    </form>
  </div>
  <div class="card">
    <div class="card-head"><span class="ic-wrap">${ICONS.users}</span><h3>Lis elèv (${cls.students.length})</h3></div>
    <div class="search-filter-bar">
      <div class="search-box">
        <input type="text" id="student-search" placeholder="Chèche yon elèv pa non, siyati oswa matrikil..." value="${escapeHtml(ui.studentSearch||'')}">
        <button type="button" id="student-search-clear" class="search-clear-btn ${(ui.studentSearch||'').trim()?'':'hidden'}" title="Efase rechèch la">×</button>
      </div>
      <select id="student-sort" class="term-select">
        <option value="oldest" ${(ui.studentSort||'oldest')==='oldest'?'selected':''}>Pi ansyen an premye</option>
        <option value="newest" ${ui.studentSort==='newest'?'selected':''}>Pi nouvo an premye</option>
        <option value="az" ${ui.studentSort==='az'?'selected':''}>A → Z</option>
        <option value="za" ${ui.studentSort==='za'?'selected':''}>Z → A</option>
      </select>
    </div>
    <div id="student-result-count" class="result-count">${studentCountLabel(cls)}</div>
    <div id="student-list-container">${studentListInnerHtml(cls)}</div>
  </div>`;
}
function filterStudents(cls){
  let list = cls.students.filter(s=>matchSearch(ui.studentSearch, s.name+' '+(s.matricule||'')));
  const sort = ui.studentSort||'oldest';
  if(sort==='az') list = list.slice().sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==='za') list = list.slice().sort((a,b)=>b.name.localeCompare(a.name));
  else if(sort==='newest') list = list.slice().reverse();
  return list;
}
function studentCountLabel(cls){
  return `${filterStudents(cls).length} elèv jwenn`;
}
function studentListInnerHtml(cls){
  const list = filterStudents(cls);
  if(cls.students.length===0) return `<div class="empty-state">Poko gen elèv nan klas sa a.</div>`;
  if(list.length===0) return `<div class="empty-state">Pa gen okenn elèv ki koresponn ak rechèch la.</div>`;
  return `<table><tbody>
      ${list.map(s=>`
      <tr><td>${studentRow(s)}</td><td style="text-align:right"><button class="btn-small btn-danger-outline" data-del-student="${s.id}">${ICONS.trash}Retire</button></td></tr>`).join('')}
    </tbody></table>`;
}
function refreshStudentList(cls, role){
  const listEl = document.getElementById('student-list-container');
  if(listEl){ listEl.innerHTML = studentListInnerHtml(cls); bindStudentRowDelete(cls, role); }
  const countEl = document.getElementById('student-result-count');
  if(countEl) countEl.textContent = studentCountLabel(cls);
  const clearBtn = document.getElementById('student-search-clear');
  if(clearBtn) clearBtn.classList.toggle('hidden', !(ui.studentSearch||'').trim());
}
function bindStudentRowDelete(cls, role){
  document.querySelectorAll('#student-list-container [data-del-student]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!await showConfirm('Retire elèv sa a nan klas la?')) return;
    cls.students = cls.students.filter(s=>s.id!==b.dataset.delStudent);
    Object.values(cls.grades).forEach(termObj=>{ delete termObj[b.dataset.delStudent]; });
    await saveData(); role==='admin'? render('admin') : render('teacher');
  }));
}

  if(listEl){ listEl.innerHTML = subjectListInnerHtml(cls, restrictId); bindSubjectRowEvents(cls, role); }

function bindSubjectRowEvents(cls, role){
  document.querySelectorAll('#subject-list-container [data-del-subject]').forEach(b=>b.addEventListener('click', async ()=>{
    cls.subjects = cls.subjects.filter(s=>s.id!==b.dataset.delSubject);
    await saveData(); role==='admin'? render('admin') : render('teacher');
  }));
  document.querySelectorAll('#subject-list-container [data-edit-subject-name]').forEach(inp=>inp.addEventListener('change', async ()=>{
    const sub = cls.subjects.find(s=>s.id===inp.dataset.editSubjectName);
    const val = inp.value.trim();
    if(sub && val){ sub.name = val; await saveData(); }
  }));
  document.querySelectorAll('#subject-list-container [data-edit-subject-coef]').forEach(inp=>inp.addEventListener('change', async ()=>{
    const sub = cls.subjects.find(s=>s.id===inp.dataset.editSubjectCoef);
    if(sub){ sub.coef = Math.max(0.1, Number(inp.value)||1); inp.value = sub.coef; await saveData(); }
  }));
  document.querySelectorAll('#subject-list-container [data-edit-subject-teacher]').forEach(inp=>inp.addEventListener('change', async ()=>{
    const sub = cls.subjects.find(s=>s.id===inp.dataset.editSubjectTeacher);
    if(!sub) return;
    const val = inp.value.trim();
    if(!val){ sub.teacherId = null; await saveData(); return; }
    const teacher = await resolveOrCreateTeacherFromName(val);
    sub.teacherId = teacher ? teacher.id : null;
    inp.value = teacher ? teacherDisplayName(teacher) : '';
    await announceIfNewTeacher(teacher);
    await saveData();
    role==='admin'? render('admin') : render('teacher');
  }));
}

function studentGradeTotal(cls, term, studentId){
  const g = (cls.grades[term] && cls.grades[term][studentId]) || {};
  let sumPoints=0;
  cls.subjects.forEach(sub=>{
    const v = g[sub.id];
    if(v!==undefined && v!=='' && v!==null && !isNaN(v)) sumPoints += Number(v);
  });
  const totalMax = cls.subjects.reduce((a,s)=>a+(s.coef||1),0);
  return {sumPoints, totalMax};
}

      <tbody>
      ${cls.students.map(st=>{

/* ===================== PRINTING ===================== */
/* ---- Enprime ak yon rezèv pou APK/WebView : anpil zouti ki tranfòme yon
   sit HTML an APK (Median.co, GoNative, WebViewGold, elatriye) sipòte
   window.print() san pwoblèm depi ou aktive opsyon "Print support" lè w
   kreye APK la. Men si pou yon rezon konfigirasyon window.print() pa
   disponib oswa pa reponn nan yon WebView, fonksyon sa a otomatikman
   telechaje yon kopi HTML endepandan (ak menm style/prezantasyon an)
   moun nan ka louvri nan Chrome oswa nan yon aplikasyon enprime pou l
   enprime l kanmenm — enpresyon pa janm rete bloke nèt. ---- */
function triggerPrint(filenameBase){
  let ok = false;
  try{
    if(typeof window.print === 'function'){ window.print(); ok = true; }
  }catch(e){ ok = false; }
  if(!ok){
    downloadPrintAreaAsHtml(filenameBase);
    showAlert('Bouton enprime a pa disponib dirèkteman isit la — nou telechaje yon kopi HTML ou ka louvri nan Chrome oswa nan yon aplikasyon enprime pou l enprime l.');
    return;
  }
  /* ---- Rezèv siplemantè : nan sèten WebView (APK), window.print() egziste
     e li pa fè erè, men li pa reyèlman louvri okenn bwat dyalòg enpresyon
     (anyen pa parèt). Nou pa ka detekte sa ak sètitid, kidonk nou ofri yon
     dezyèm chemen ki toujou disponib: yon ti notifikasyon ak yon bouton pou
     telechaje menm dokiman an kòm yon fichye HTML, pou moun nan ka enprime
     l nan Chrome oswa nan yon lòt aplikasyon si bwat dyalòg la pa t parèt. ---- */
  showToast({
    title:'Si enpresyon an pa parèt...',
    message:'Klike la a pou telechaje yon kopi HTML ou ka enprime.',
    onClick:()=>downloadPrintAreaAsHtml(filenameBase)
  });
}
/* ---- Pran tout <style> paj la (menm CSS ki itilize pou apèsi a) epi
   anfèmen kontni #print-area a nan yon fichye HTML endepandan, ak menm
   prezantasyon an, moun nan ka telechaje, louvri nan yon lòt navigatè,
   pataje, oswa enprime san l pa bezwen aplikasyon Jesyon Lekòl la. ---- */
function downloadPrintAreaAsHtml(filenameBase){
  const content = document.getElementById('print-area').innerHTML;
  const styles = Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\n');
  const safeTitle = escapeHtml(filenameBase||'Dokiman');
  const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${safeTitle}</title><style>${styles}
  body{margin:0;background:#fff;} #print-area{display:block !important;}</style></head>
  <body><div id="print-area">${content}</div></body></html>`;
  try{
    const blob = new Blob([doc], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = String(filenameBase||'dokiman').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9-_ ]/g,'').trim().replace(/\s+/g,'-') + '.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ console.error('Telechajman kopi HTML echwe', e); }
}
/* ---- Chanje oryantasyon paj (A4) pou enprime yon dokiman lajè kòm Palmarès la,
   san sa pa afekte lòt dokiman yo (li retounen an pòtrè otomatikman apre). ---- */
function setPrintOrientation(mode){
  let tag = document.getElementById('print-orientation-style');
  if(!tag){
    tag = document.createElement('style');
    tag.id = 'print-orientation-style';
    document.head.appendChild(tag);
  }
  tag.textContent = mode==='landscape' ? '@page{ size:A4 landscape; margin:10mm 12mm; }' : '';
  const reset = ()=>{ tag.textContent=''; window.removeEventListener('afterprint', reset); };
  window.addEventListener('afterprint', reset);
}
/* buildXxxHtml() retounen sèlman HTML final la (renderPrintFrame), san okenn
   efè segondè — sa pèmèt itilize menm rezilta a ni pou apèsi sou paj la
   (doc-preview-scroll) ni pou #print-area lè n ap reyèlman enprime. */

function buildGeneralBulletinHtml(cls, studentId){
  const st = cls.students.find(s=>s.id===studentId);
  if(!st) return '';
  const perTerm = DATA.terms.map(t=>{
    const {ranked} = computeRanking(cls, t);
    const row = ranked.find(r=>r.student.id===studentId);
    const g = (cls.grades[t] && cls.grades[t][studentId]) || {};
    return {term:t, row, g, total:ranked.length};
  });
  const subjectRows = cls.subjects.map(sub=>{
    const cells = perTerm.map(pt=>`<td>${pt.g[sub.id]??'—'}</td>`).join('');
    return `<tr><td>${escapeHtml(sub.name)} <span style="opacity:.6">/${sub.coef}</span></td>${cells}</tr>`;
  }).join('');
  const termTotals = perTerm.map(pt=>studentGradeTotal(cls, pt.term, studentId));
  const totalRow = `<tr style="font-weight:800;border-top:2px solid #000"><td>TOTAL</td>${termTotals.map(tt=>`<td>${tt.sumPoints} / ${tt.totalMax}</td>`).join('')}</tr>`;
  const avgRow = `<tr class="p-total-row"><td><strong>Moyenne ${avgScaleLabel()}</strong></td>${perTerm.map(pt=>`<td><strong>${pt.row? fmtAvg(pt.row.avg):'—'}</strong></td>`).join('')}</tr>`;
  const rankRow = `<tr><td>Rang dans la classe</td>${perTerm.map(pt=>`<td>${pt.row? (pt.row.rank+'/'+pt.total) : '—'}</td>`).join('')}</tr>`;
  const mentionRow = `<tr><td>Mention</td>${perTerm.map(pt=>`<td>${pt.row? mentionForFR(pt.row.avg) : '—'}</td>`).join('')}</tr>`;
  const validAvgs = perTerm.filter(pt=>pt.row).map(pt=>pt.row.avg);
  const annualAvg = validAvgs.length ? (validAvgs.reduce((a,b)=>a+b,0)/validAvgs.length) : null;
  const grandPoints = termTotals.reduce((a,t)=>a+t.sumPoints,0);
  const grandMax = termTotals.reduce((a,t)=>a+t.totalMax,0);
  const bodyHtml = `
      <table class="p-table">
        <thead><tr><th>Matière</th>${DATA.terms.map(t=>`<th>${escapeHtml(termFR(t))}</th>`).join('')}</tr></thead>
        <tbody>${subjectRows}${totalRow}${avgRow}${rankRow}${mentionRow}</tbody>
      </table>
      <div class="p-avgline">
        <strong>Total général (tous trimestres) :</strong> ${grandPoints} / ${grandMax} &nbsp;&nbsp;
        <strong>Moyenne Générale Annuelle ${avgScaleLabel()}:</strong> ${annualAvg!==null? fmtAvg(annualAvg) : '—'} &nbsp;&nbsp;
        <strong>Mention générale :</strong> ${annualAvg!==null? mentionForFR(annualAvg) : '—'}
      </div>`;
  return renderPrintFrame(getPrintStyle('bulletin'), {
    subtitle: `Bulletin Général Annuel — Classe ${escapeHtml(cls.name)}`,
    metaRows: [
      [`Élève : <strong>${escapeHtml(st.name)}</strong>`, `Matricule : ${escapeHtml(st.matricule||'—')}`],
      [`Année scolaire : ${escapeHtml(ensureSchool().year||'—')}`, `Date d'impression : ${printDateStr()}`]
    ],
    bodyHtml,
    signHtml: printSignBlock()
  });
}

function docFontById(id){ return DOC_FONTS.find(f=>f.id===id) || DOC_FONTS[0]; }
function buildDocBody(typeId, cls, st){
  const s = ensureSchool();
  const direction = s.director ? escapeHtmlNone(s.director) : 'la Direction';
  const ecole = DATA.schoolName || 'notre établissement';
  const nom = st.name;
  const classe = cls.name;
  const annee = DATA.activeYear || s.year || '—';
  const dobPart = st.dob ? `né(e) le ${new Date(st.dob+'T00:00:00').toLocaleDateString('fr-FR')}` : '';
  const matPart = st.matricule ? `immatriculé(e) sous le numéro ${st.matricule}` : '';
  const qualifiers = [dobPart, matPart].filter(Boolean).join(', ');
  const identite = qualifiers ? `${nom}, ${qualifiers},` : nom;
  switch(typeId){
    case 'scolarite':
      return `Je soussigné(e), ${direction}, Directeur/Directrice de ${ecole}, certifie par la présente que l'élève ${identite} est régulièrement inscrit(e) au sein de notre établissement et y poursuit ses études avec assiduité, en classe de ${classe}, au titre de l'année scolaire ${annee}.\n\nSon inscription est dûment consignée sur les registres officiels de l'institution, où il/elle figure sans discontinuité depuis l'ouverture de ladite année scolaire, aux côtés de l'ensemble des élèves régulièrement admis.\n\nEn foi de quoi, le présent certificat de scolarité lui est délivré à sa demande, pour servir et valoir ce que de droit auprès de qui il appartiendra.`;
    case 'frequentation':
      return `Je soussigné(e), ${direction}, Directeur/Directrice de ${ecole}, certifie par la présente que l'élève ${identite}, inscrit(e) en classe de ${classe} au titre de l'année scolaire ${annee}, a fréquenté notre établissement avec une remarquable régularité, suivant avec constance et intérêt l'ensemble des enseignements qui y sont dispensés.\n\nAucun fait de nature à entacher l'assiduité de cet(te) élève n'a été porté, à ce jour, à la connaissance de la Direction, qui se plaît à souligner la constance de sa présence tout au long de l'année.\n\nEn foi de quoi, le présent certificat de fréquentation lui est délivré pour servir et valoir ce que de droit.`;
    case 'reussite':
      return `Je soussigné(e), ${direction}, Directeur/Directrice de ${ecole}, certifie par la présente que l'élève ${identite}, inscrit(e) en classe de ${classe} au cours de l'année scolaire ${annee}, a satisfait avec brio à l'ensemble des exigences académiques fixées par notre établissement et a été déclaré(e) admis(e) au terme de ladite année scolaire.\n\nCette belle réussite, fruit d'un travail soutenu, d'une constance louable et d'une réelle volonté de bien faire, témoigne du sérieux et de la rigueur dont il/elle a fait preuve tout au long de son parcours scolaire.\n\nEn foi de quoi, le présent certificat de réussite lui est délivré, avec toutes les félicitations de la Direction, pour servir et valoir ce que de droit.`;
    case 'attestation':
      return `Je soussigné(e), ${direction}, Directeur/Directrice de ${ecole}, atteste par la présente que l'élève ${identite} est régulièrement inscrit(e) au sein de notre établissement, en classe de ${classe}, au titre de l'année scolaire ${annee}, et y poursuit sa scolarité dans des conditions conformes aux exigences de l'institution.\n\nLa présente attestation, dont l'exactitude est garantie sous la responsabilité de la Direction, est établie à la demande de l'intéressé(e), pour servir et valoir ce que de droit auprès de toute autorité ou institution appelée à en connaître.`;
    case 'conduite':
      return `Je soussigné(e), ${direction}, Directeur/Directrice de ${ecole}, certifie par la présente que l'élève ${identite}, inscrit(e) en classe de ${classe} au cours de l'année scolaire ${annee}, a observé, durant toute sa scolarité au sein de notre établissement, une conduite exemplaire, empreinte de respect et de civisme envers le personnel, ses camarades et le règlement intérieur de l'institution.\n\nAucune sanction disciplinaire majeure n'a été relevée à son encontre durant la période considérée, et son comportement a constamment reflété les valeurs et principes que notre établissement s'attache à transmettre.\n\nEn foi de quoi, le présent certificat de bonne conduite lui est délivré pour servir et valoir ce que de droit.`;
    case 'transfert':
      return `Je soussigné(e), ${direction}, Directeur/Directrice de ${ecole}, certifie par la présente que l'élève ${identite} a été régulièrement inscrit(e) et a poursuivi ses études, avec sérieux et assiduité, en classe de ${classe} au sein de notre établissement, jusqu'à ce jour, au titre de l'année scolaire ${annee}.\n\nL'élève quitte notre institution en règle avec l'administration, tant sur le plan académique que disciplinaire, et son dossier scolaire, tenu à jour, demeure à la disposition de tout établissement appelé à l'accueillir dans la poursuite de sa scolarité.\n\nEn foi de quoi, le présent certificat de transfert lui est délivré, avec tous nos vœux de succès pour la suite de son parcours, pour servir et valoir ce que de droit.`;
    case 'fin_etudes':
      return `Je soussigné(e), ${direction}, Directeur/Directrice de ${ecole}, certifie par la présente que l'élève ${identite} a suivi, au sein de notre établissement, l'intégralité du cycle d'études sanctionné par la classe de ${classe}, et a mené à terme sa scolarité, avec application et constance, au titre de l'année scolaire ${annee}.\n\nAu cours de ce parcours, l'élève a satisfait à l'ensemble des obligations académiques et disciplinaires requises pour l'achèvement de ce cycle d'études, faisant preuve d'une belle assiduité et d'un engagement digne d'éloges.\n\nEn foi de quoi, le présent certificat de fin d'études lui est délivré, en témoignage de ce parcours mené à son terme, pour servir et valoir ce que de droit.`;
    case 'recommandation':
      return `${direction}, Directeur/Directrice de ${ecole}, a le plaisir et l'honneur de recommander chaleureusement l'élève ${identite}, inscrit(e) en classe de ${classe} au titre de l'année scolaire ${annee}.\n\nDurant tout son parcours au sein de notre établissement, cet(te) élève s'est distingué(e) par un sérieux constant, une conduite exemplaire et un engagement soutenu dans son travail scolaire, qualités qui témoignent d'un réel sens des responsabilités et d'une belle capacité à évoluer avec succès dans un nouvel environnement académique.\n\nC'est donc en toute confiance, et avec la conviction qu'il/elle saura donner satisfaction partout où il/elle sera admis(e), que la présente lettre de recommandation lui est délivrée, pour servir et valoir ce que de droit.`;
    default:
      return '';
  }
}
/* Version texte simple (sans échapper le HTML) utilisée seulement pour composer
   le corps du texte ci-dessus — le résultat final passe par escapeHtml au rendu. */
function escapeHtmlNone(s){ return String(s||''); }
function docSignBlock(){
  const s = ensureSchool();
  return `<div class="p-sign" style="justify-content:flex-end"><div style="width:46%;border-top:none;padding-top:0">${directorSignatureHtml()}</div></div>`;
}
/* ---- Blòk siyati ofisyèl direktè a — sèvi nan tout modèl dokiman ofisyèl
   yo. Non direktè a (si li konfigire) parèt an fòm siyati/paraf jis sou
   liy la ; anba liy lan, tit fonksyon an ("Directeur / Directrice") ekri
   an lèt klè pou moun ki resevwa dokiman an ka idantifye siyati a byen
   fasil, menm si li pa li kaligrafi a byen klè. ---- */
function directorSignatureHtml(roleLabel){
  const s = ensureSchool();
  const name = s.director ? escapeHtml(s.director) : '&nbsp;';
  const role = roleLabel || 'Directeur / Directrice';
  return `<div class="doc-sign-name">${name}</div><div class="line"></div><div class="doc-sign-role">${role}</div>`;
}
function docBodyParagraphsHtml(body){
  const paragraphs = String(body||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  return paragraphs.length
    ? paragraphs.map(p=>`<p>${escapeHtml(p).replace(/\n/g,'<br>')}</p>`).join('')
    : `<p style="color:#999">—</p>`;
}
/* ---- Style enn (CSS vars + font) pou aplike koulè/estil ekriti aplike sou
   dokiman ofisyèl la san sa pa afekte lòt papye enpresyon yo. ---- */
function docStyleAttr(colorId, fontId){
  const c = docColorById(colorId), f = docFontById(fontId);
  return `--doc-primary:${c.primary};--doc-accent:${c.accent};font-family:${f.family};`;
}
/* ---- Modèle 1 : CLASSIQUE — cadre sobre, même style que Bulletin/Fiche/Palmarès ---- */
function renderDocClassic(cls, st, title, body, colorId, fontId){
  const bodyHtml = docBodyParagraphsHtml(body);
  return `
    <div class="p-frame" style="${docStyleAttr(colorId, fontId)}">
      <div class="p-header">        ${officialStampHtml()}
        <div><div class="p-school">${escapeHtml(DATA.schoolName)}</div>
        <div class="p-sub">Classe ${escapeHtml(cls.name)} — Année scolaire ${escapeHtml(DATA.activeYear||ensureSchool().year||'—')}</div>${schoolHeaderMetaHtml()}</div>
      </div>
      <div class="p-meta"><span>Élève : <strong>${escapeHtml(st.name)}</strong></span><span>Matricule : ${escapeHtml(st.matricule||'—')}</span></div>
      ${title? `<div class="p-doc-title">${escapeHtml(title)}</div>` : '<div style="height:10px"></div>'}
      <div class="p-doc-body">${bodyHtml}</div>
      <div class="p-doc-date">Fait le ${printDateStr()}</div>
      ${docSignBlock()}
    </div>`;
}

function renderOfficialDocHtml(cls, st, title, body, templateId, colorId, fontId){
  const tpl = templateId || 'classic';
  if(tpl==='elegant') return renderDocElegant(cls, st, title, body, colorId, fontId);
  if(tpl==='modern') return renderDocModern(cls, st, title, body, colorId, fontId);
  if(tpl==='decoratif') return renderDocDecoratif(cls, st, title, body, colorId, fontId);
  if(tpl==='dore') return renderDocDore(cls, st, title, body, colorId, fontId);
  if(tpl==='minimaliste') return renderDocMinimaliste(cls, st, title, body, colorId, fontId);
  if(tpl==='corporate') return renderDocCorporate(cls, st, title, body, colorId, fontId);
  if(tpl==='diagonal') return renderDocDiagonal(cls, st, title, body, colorId, fontId);
  if(tpl==='vagues') return renderDocVagues(cls, st, title, body, colorId, fontId);
  if(tpl==='confettis') return renderDocConfettis(cls, st, title, body, colorId, fontId);
  if(tpl==='aquarelle') return renderDocAquarelle(cls, st, title, body, colorId, fontId);
  if(tpl==='mosaique') return renderDocMosaique(cls, st, title, body, colorId, fontId);
  if(tpl==='laurier') return renderDocLaurier(cls, st, title, body, colorId, fontId);
  if(tpl==='bandeau') return renderDocBandeau(cls, st, title, body, colorId, fontId);
  if(tpl==='sceau') return renderDocSceau(cls, st, title, body, colorId, fontId);
  if(tpl==='universite') return renderDocUniversite(cls, st, title, body, colorId, fontId);
  if(tpl==='heraldique') return renderDocHeraldique(cls, st, title, body, colorId, fontId);
  if(tpl==='diplomatique') return renderDocDiplomatique(cls, st, title, body, colorId, fontId);
  if(tpl==='oxbridge') return renderDocOxbridge(cls, st, title, body, colorId, fontId);
  if(tpl==='accreditation') return renderDocAccreditation(cls, st, title, body, colorId, fontId);
  return renderDocClassic(cls, st, title, body, colorId, fontId);
}

/* ---- Ti moso konfeti (SVG pozisyone an absoli) — sèvi ak yon sèl koulè
   tèm lan men aplike hue-rotate pou jenere plizyè ti nyans diferan ---- */
function confettiPiece(styleExtra, size, shape, hue, color){
  const style = `position:absolute;width:${size}px;height:${size}px;filter:hue-rotate(${hue}deg);${styleExtra}`;
  let inner;
  if(shape==='rect') inner = `<rect x="1" y="1" width="${size-2}" height="${size-2}" rx="2" fill="${color}" transform="rotate(25 ${size/2} ${size/2})"/>`;
  else if(shape==='tri') inner = `<polygon points="${size/2},1 ${size-1},${size-1} 1,${size-1}" fill="${color}"/>`;
  else inner = `<circle cx="${size/2}" cy="${size/2}" r="${size/2-1}" fill="${color}"/>`;
  return `<svg style="${style}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

/* ---- Bandeau mozayik triyang alterne primary/accent ---- */
function mosaicTriRow(){
  const n = 20, w = 800/n;
  let polys = '';
  for(let i=0;i<n;i++){
    const x = i*w;
    const fill = (i%2===0) ? 'var(--doc-primary,#16233F)' : 'var(--doc-accent,#C9A227)';
    const opacity = (i%4<2) ? 1 : .6;
    polys += `<polygon points="${x},34 ${x+w},34 ${x+w/2},0" fill="${fill}" opacity="${opacity}"/>`;
  }
  return `<svg viewBox="0 0 800 34" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${polys}</svg>`;
}

    const previewBlock = (ui.docsShowPreview && st) ? `
