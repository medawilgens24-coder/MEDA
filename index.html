/* ===================== EVENTS ===================== */
function wireEvents(view){
  bindPassToggles();
  if(view==='schoolgate'){
    const joinBtn = document.getElementById('gate-join-legacy');
    if(joinBtn) joinBtn.addEventListener('click', async ()=>{
      setSchoolId('');
      ui.allowJoinSignup = false; ui.authMode = null;
      DATA = window.__pendingLegacyData || null;
      if(DATA){
        normalizeLoadedData(DATA);
        if(!DATA.terms || DATA.terms.length===0) DATA.terms=[...DEFAULT_TERMS];
        if(!DATA.avgScale) DATA.avgScale = 100;
        migrateAcademicYears();
        migrateTeacherProfiles();
        ui.term = DATA.terms[0];
      }
      render('login');
    });
    const newBtn = document.getElementById('gate-new-school');
    if(newBtn) newBtn.addEventListener('click', ()=>{
      const newCode = genCode();
      setSchoolId(newCode);
      DATA = { schoolName:'', crestCode:'', admins:[], classes:[], terms:[...DEFAULT_TERMS] };
      normalizeLoadedData(DATA);
      DATA.avgScale = 100;
      ui.term = DATA.terms[0];
      ui.authMode = 'signup'; ui.allowJoinSignup = false; ui.errors={};
      render('login');
    });
    const codeBtn = document.getElementById('gate-use-code');
    if(codeBtn) codeBtn.addEventListener('click', async ()=>{
      const code = await showPrompt('Ekri kòd lekòl la (6 karaktè):');
      if(!code || !code.trim()) return;
      const clean = code.trim().toUpperCase();
      setSchoolId(clean);
      let loaded;
      try{ loaded = await loadData(); }catch(e){ loaded = null; }
      if(!loaded){
        clearSchoolChoice();
        await showAlert('Pa gen okenn lekòl ak kòd sa a. Verifye kòd la.');
        return;
      }
      DATA = loaded;
      normalizeLoadedData(DATA);
      if(!DATA.terms || DATA.terms.length===0) DATA.terms=[...DEFAULT_TERMS];
      if(!DATA.avgScale) DATA.avgScale = 100;
      migrateAcademicYears();
      migrateTeacherProfiles();
      ui.term = DATA.terms[0];
      /* Moun nan te antre kòd sekrè lekòl la limenm — sa se yon envitasyon
         reyèl, kidonk li gen dwa kreye yon kont administratè sou lekòl sa a. */
      ui.allowJoinSignup = true;
      render('login');
    });
  }
  else if(view==='login'){
    document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{ ui.loginTab=b.dataset.tab; ui.errors={}; render('login'); }));
    document.querySelectorAll('[data-authmode]').forEach(b=>b.addEventListener('click', ()=>{ ui.authMode=b.dataset.authmode; ui.errors={}; render('login'); }));

    /* Yon sèl demann senp: si moun nan gen yon kòd envitasyon (pou l vin
       dezyèm administratè sou yon lekòl ki egziste deja), n al chèche
       done lekòl sa a; si l kite chan an vid, n ale — san okenn lòt
       kesyon oswa avètisman. */
    const switchLink = document.getElementById('switch-school-link');
    if(switchLink) switchLink.addEventListener('click', async ()=>{
      const code = await showPrompt('Ekri kòd lekòl la (6 karaktè):');
      if(!code || !code.trim()) return;
      const clean = code.trim().toUpperCase();
      const prevId = getSchoolId();
      setSchoolId(clean);
      let loaded;
      try{ loaded = await loadData(); }catch(e){ loaded = null; }
      if(!loaded){
        if(prevId===null) clearSchoolChoice(); else setSchoolId(prevId);
        await showAlert('Pa gen okenn lekòl ak kòd sa a. Verifye kòd la.');
        return;
      }
      DATA = loaded;
      normalizeLoadedData(DATA);
      if(!DATA.terms || DATA.terms.length===0) DATA.terms=[...DEFAULT_TERMS];
      if(!DATA.avgScale) DATA.avgScale = 100;
      migrateAcademicYears();
      migrateTeacherProfiles();
      ui.term = DATA.terms[0];
      /* Moun nan te antre kòd sekrè lekòl la limenm — sa se yon envitasyon
         reyèl, kidonk li gen dwa kreye yon kont administratè sou lekòl sa a. */
      ui.allowJoinSignup = true;
      ui.authMode = 'signup'; ui.errors={};
      render('login');
    });

    const af = document.getElementById('login-admin-form');
    if(af) af.addEventListener('submit', async e=>{
      e.preventDefault();
      const email = document.getElementById('l-email').value.trim();
      const p = document.getElementById('l-pass').value;
      if(!FIREBASE_ENABLED || !fbAuth){ ui.errors.login=FIREBASE_INIT_ERROR || 'Firebase pa konfigire — enposib pou konekte.'; render('login'); return; }
      const btn = af.querySelector('button[type="submit"]');
      if(btn) btn.disabled = true;
      try{
        const cred = await fbAuth.signInWithEmailAndPassword(email, p);
        /* IMPÒTAN: rechaje done lekòl la KOUNYE A, apre otantifikasyon an
           fin reyisi. Anvan koneksyon an, aparèy la te ka sèlman gen yon
           sesyon ANONIM (pa egzanp si app la fèk relanse apre yon
           dekoneksyon) — si règ sekirite Firebase yo mande yon VRE kont
           pou li done lekòl la, chajman ANONIM sa a echwe an silans e
           DATA rete vid. San liy sa a, nou ta kontinye ap tcheke yon DATA
           ki poko reyèlman reprezante lekòl la, epi nou ta di "pa gen
           pwofil administratè" bay yon moun ki gen yon kont ki egziste
           byen. Kounye a nou gen yon sesyon otantifye ak vrè dwa, nou
           reyesèye chaje done yo anvan nou tcheke lis administratè yo. */
        let reloaded;
        try{ reloaded = await loadData(); }catch(e){ reloaded = null; }
        if(reloaded){
          DATA = reloaded;
          normalizeLoadedData(DATA);
          if(!DATA.terms || DATA.terms.length===0) DATA.terms=[...DEFAULT_TERMS];
          if(!DATA.avgScale) DATA.avgScale = 100;
          migrateAcademicYears();
          migrateTeacherProfiles();
          ui.term = DATA.terms[0];
        }
        let rec = (DATA.admins||[]).find(a=>a.uid===cred.user.uid);
        if(!rec){
          /* Kont sa a ka fè pati yon LÒT lekòl aparèy sa a te deja itilize
             oswa ka konekte ak — chèche l epi swiche otomatikman anvan nou
             deklare erè. Sa pèmèt jere plizyè kont/lekòl san frikisyon. */
          const switched = await switchToSchoolForUid(cred.user.uid);
          if(switched) rec = (DATA.admins||[]).find(a=>a.uid===cred.user.uid);
        }
        if(!rec){
          await fbAuth.signOut();
          await ensureBaselineAuth();
          ui.errors.login='Kont sa a konekte, men pa gen okenn pwofil administratè ki asosye avè l pou okenn lekòl.';
          render('login');
          return;
        }
        session = {role:'admin', classId:null, teacherId:null, adminUsername:rec.username};
        ui.adminView='akey'; ui.classDetailFor=null; ui.errors={};
        recordAdminSchool(cred.user.uid);
        render('admin');
      }catch(err){
        ui.errors.login = firebaseAuthErrorMessage(err);
        render('login');
      }
    });

    const suf = document.getElementById('signup-admin-form');
    if(suf) suf.addEventListener('submit', async e=>{
      e.preventDefault();
      if(!FIREBASE_ENABLED || !fbAuth){ ui.errors.signup=FIREBASE_INIT_ERROR || 'Firebase pa konfigire — enposib pou kreye kont.'; render('login'); return; }
      /* joiningExisting = moun nan te antre yon kòd envitasyon eksprè pou l
         vin dezyèm administratè sou yon lekòl ki egziste deja. Nan tout
         lòt ka, "Kreye kont" toujou kreye pwòp lekòl izole pa li otomatikman
         an background — tankou Facebook, san moun nan pa gen okenn kesyon
         teknik pou reponn. */
      const joiningExisting = ui.allowJoinSignup === true;
      const schoolEl = document.getElementById('su-school');
      const school = joiningExisting ? DATA.schoolName : (schoolEl? schoolEl.value.trim() : '');
      const name = document.getElementById('su-name').value.trim();
      const email = document.getElementById('su-email').value.trim();
      const pass = document.getElementById('su-pass').value;
      const pass2 = document.getElementById('su-pass2').value;
      if(!joiningExisting && !school){ ui.errors.signup='Ekri non lekòl la.'; render('login'); return; }
      if(!name||!email||!pass){ ui.errors.signup='Ranpli tout chan yo.'; render('login'); return; }
      if(pass.length<6){ ui.errors.signup='Kòd sekrè a dwe gen omwen 6 karaktè.'; render('login'); return; }
      if(pass!==pass2){ ui.errors.signup='Kòd sekrè yo pa menm.'; render('login'); return; }
      if(joiningExisting && (DATA.admins||[]).some(a=>a.email && a.email.toLowerCase()===email.toLowerCase())){ ui.errors.signup='Yon kont deja itilize imèl sa a.'; render('login'); return; }
      /* Non itilizatè a jenere otomatikman apati imèl la — pa gen chan
         siplemantè pou tape l, sa senplifye fòm nan san touche kòd sekrè
         a, ke se moun nan menm ki chwazi. */
      const user = uniqueAdminUsername(email);
      try{
        const cred = await fbAuth.createUserWithEmailAndPassword(email, pass);
        if(!joiningExisting){
          /* Chak nouvo kont kreye pwòp lekòl izole pa li, otomatikman,
             san li pa bezwen konnen anyen sou "kòd" — done sa a pa gen
             okenn lyen ak nenpòt lòt kont ki egziste deja. */
          const newCode = genCode();
          setSchoolId(newCode);
          DATA = { schoolName:school, crestCode:'', admins:[], classes:[], terms:[...DEFAULT_TERMS] };
          normalizeLoadedData(DATA);
          DATA.avgScale = 100;
        }
        if(!DATA.admins) DATA.admins=[];
        if(!DATA.terms || DATA.terms.length===0) DATA.terms=[...DEFAULT_TERMS];
        if(!DATA.classes) DATA.classes=[];
        DATA.admins.push({id:uid(), name, username:user, email, uid:cred.user.uid});
        await saveData();
        await recordAdminSchool(cred.user.uid);
        session = {role:'admin', classId:null, teacherId:null, adminUsername:user};
        ui.adminView='akey'; ui.classDetailFor=null; ui.errors={}; ui.term = DATA.terms[0]; ui.allowJoinSignup=false;
        render('admin');
      }catch(err){
        ui.errors.signup = firebaseAuthErrorMessage(err);
        render('login');
      }
    });

    const forgotLink = document.getElementById('forgot-pass-link');
    if(forgotLink) forgotLink.addEventListener('click', async e=>{
      e.preventDefault();
      if(!FIREBASE_ENABLED || !fbAuth){ await showAlert(FIREBASE_INIT_ERROR || 'Firebase pa konfigire.'); return; }
      const email = await showPrompt('Ekri imèl kont administratè ou a. N ap voye yon lyen pou chwazi yon nouvo kòd sekrè:');
      if(!email || !email.trim()) return;
      try{
        await fbAuth.sendPasswordResetEmail(email.trim());
        await showAlert('Yon imèl voye bay '+email.trim()+' ak yon lyen pou chwazi yon nouvo kòd sekrè (verifye Spam si w pa wè l — sit rekiperasyon an ap rele l "modpas", se menm bagay ak kòd sekrè a).');
      }catch(err){
        await showAlert(firebaseAuthErrorMessage(err));
      }
    });

        render('admin');
      }));
      const nyf = document.getElementById('new-year-form');
      if(nyf) nyf.addEventListener('submit', async e=>{
        e.preventDefault();
        const year = document.getElementById('ny-year').value.trim();
        if(!isValidYearFormat(year)){ await showAlert('Fòma ane a pa bon. Egzanp valab: 2026-2027.'); return; }
        const existing = listAcademicYears();
        if(existing.includes(year)){ await showAlert('Ane sa a deja egziste.'); return; }
        if(!await showConfirm(`Kreye ane akademik "${year}" epi fè l vin ane aktif?`)) return;
        createAcademicYear(year);
        switchActiveYear(year);
        await saveData();
        await showAlert(`Ane "${year}" kreye epi vin ane aktif la.`);
        render('admin');
      });
      const pmf = document.getElementById('promote-form');
      if(pmf) pmf.addEventListener('submit', async e=>{
        e.preventDefault();
        const from = document.getElementById('pm-from').value;
        const to = document.getElementById('pm-to').value;
        if(from===to){ await showAlert('Chwazi de ane diferan pou fè kopi a.'); return; }
        if(!await showConfirm(`Kopye tout klas ak elèv nan "${from}" vè "${to}"?\n\nSa ap kreye nouvo klas endepandan (san nòt) nan "${to}". Anyen nan "${from}" pap chanje.`)) return;
        const n = promoteStudentsToYear(from, to);
        await saveData();
        await showAlert(`${n} elèv kopye nan "${to}".`);
        render('admin');
      });
      const dlBackup = document.getElementById('download-backup');
      if(dlBackup) dlBackup.addEventListener('click', downloadBackupNow);
      const restoreInput = document.getElementById('restore-backup-input');
      if(restoreInput) restoreInput.addEventListener('change', async e=>{
        const file = e.target.files && e.target.files[0];
        if(!file) return;
        try{
          const text = await file.text();
          const parsed = JSON.parse(text);
          if(!parsed || typeof parsed!=='object'){ await showAlert('Fichye a pa yon backup valab.'); restoreInput.value=''; return; }
          if(!await showConfirm('Retabli backup sa a ap ranplase TOUT done aktyèl yo (tout ane akademik, klas, elèv, nòt). Kontinye?')) { restoreInput.value=''; return; }
          DATA = parsed;
          if(!DATA.terms || DATA.terms.length===0) DATA.terms=[...DEFAULT_TERMS];
          if(!DATA.avgScale) DATA.avgScale = 100;
          migrateAcademicYears();
          migrateTeacherProfiles();
          await saveData();
          await showAlert('Backup retabli avèk siksè.');
          ui.adminView='paramet'; ui.classDetailFor=null; ui.term = DATA.terms[0];
          render('admin');
        }catch(err){ await showAlert('Fichye a pa yon backup valab.'); }
        restoreInput.value='';
      });
      const fixBtn = document.getElementById('auto-fix-issues');
      if(fixBtn) fixBtn.addEventListener('click', async ()=>{
        const iss = scanDataIssues();
        const n = iss.invalidGrades.length + iss.danglingGrades.length;
        if(n===0) return;
        if(!await showConfirm(`Sa ap telechaje yon backup epi retire ${n} nòt envalid/referans ki pa egziste ankò. Aksyon sa a PA touche okenn klas, elèv oswa matyè. Kontinye?`)) return;
        downloadBackupNow();
        const fixed = fixSafeDataIssues();
        await saveData();
        await showAlert(`${fixed} pwoblèm korije. Backup te telechaje anvan korije yo.`);
        render('admin');
      });
      document.getElementById('school-form').addEventListener('submit', async e=>{
        e.preventDefault();
        const school = ensureSchool();
        school.name = document.getElementById('st-school').value.trim() || school.name;
        DATA.crestCode = document.getElementById('st-crest').value.trim();
        school.director = document.getElementById('st-director').value.trim();
        school.address = document.getElementById('st-address').value.trim();
        school.phone = document.getElementById('st-phone').value.trim();
        school.email = document.getElementById('st-email').value.trim();
        school.motto = document.getElementById('st-motto').value.trim();
        DATA.schoolName = school.name;
        await saveData();
        await showAlert('Enfòmasyon etablisman an anrejistre.');
        render('admin');
      });
      const schoolLogoInput = document.getElementById('school-logo-input');
      if(schoolLogoInput) schoolLogoInput.addEventListener('change', async e=>{
        const file = e.target.files && e.target.files[0];
        if(!file) return;
        try{
          const dataUrl = await resizeImageToDataUrl(file, 320, 0.85);
          ensureSchool().logo = dataUrl;
          await saveData(); render('admin');
        }catch(err){ await showAlert('Pa t kapab chaje imaj sa a.'); }
      });
      const schoolLogoRemove = document.getElementById('school-logo-remove');
      if(schoolLogoRemove) schoolLogoRemove.addEventListener('click', async ()=>{
        ensureSchool().logo = ''; await saveData(); render('admin');

      const stampImageInput = document.getElementById('stamp-image-input');
      if(stampImageInput) stampImageInput.addEventListener('change', async ()=>{

        if(!file) return;

      });
      const stampImageRemove = document.getElementById('stamp-image-remove');
      if(stampImageRemove) stampImageRemove.addEventListener('click', async ()=>{
        if(!await showConfirm('Siprime kachèt ofisyèl la? Okenn kachèt pap parèt sou dokiman yo apre sa, jiskaske w ajoute yon lòt.')) return;
        DATA.officialStampImage = null;
        await saveData();
        render('admin');
      });
      const themeSw = document.getElementById('theme-switch');
      if(themeSw) themeSw.addEventListener('change', async ()=>{

        ui.appearance = mode; applyAppearance(mode); await saveAppearance(mode);
      });
      const navStyleSel = document.getElementById('nav-style-select');
      if(navStyleSel) navStyleSel.addEventListener('change', async ()=>{
        const mode = navStyleSel.value;
        ui.navStyle = mode; applyNavStyle(mode); await saveNavStyle(mode);
      });
      const notifSw = document.getElementById('notif-switch');
      if(notifSw) notifSw.addEventListener('change', async ()=>{
        if(notifSw.checked){
          const granted = await requestDesktopNotifPermission();
          if(!granted && 'Notification' in window && Notification.permission==='denied'){
            notifSw.checked = false;
            await showAlert('Navigatè a bloke notifikasyon yo pou paj sa a. Ale nan paramèt navigatè a pou otorize yo, epi eseye ankò.');

        ui.notifDesktop = notifSw.checked;
        await saveNotifPref(ui.notifDesktop);
      });
      const scaleSel = document.getElementById('avg-scale-select');
      if(scaleSel) scaleSel.addEventListener('change', async ()=>{
        DATA.avgScale = Number(scaleSel.value)===10 ? 10 : 100;
        await saveData(); render('admin');
      });
      document.getElementById('term-form').addEventListener('submit', async e=>{
        e.preventDefault(); const t=document.getElementById('new-term').value.trim(); if(t && !DATA.terms.includes(t)){ DATA.terms.push(t); await saveData(); } render('admin');

      document.querySelectorAll('[data-del-term]').forEach(b=>b.addEventListener('click', async ()=>{
        DATA.terms.splice(Number(b.dataset.delTerm),1); await saveData(); render('admin');
      }));
      document.querySelectorAll('[data-del-admin]').forEach(b=>b.addEventListener('click', async ()=>{
        if(!await showConfirm('Retire kont administratè sa a nan lekòl la? (Sa retire aksè li nan aplikasyon an; kont Firebase li — imèl/modpas — ap toujou egziste. Pou efase l nèt, fè l apati Firebase Console.)')) return;
        DATA.admins = DATA.admins.filter(a=>a.id!==b.dataset.delAdmin);
        await saveData(); render('admin');
      }));
      document.getElementById('pass-form').addEventListener('submit', async e=>{
        e.preventDefault();
        const cur = document.getElementById('cur-pass').value;
        const p = document.getElementById('new-pass').value;
        const p2 = document.getElementById('new-pass2').value;
        if(!p || p.length < 6){ await showAlert('Nouvo kòd sekrè a dwe gen omwen 6 karaktè.'); return; }
        if(p !== p2){ await showAlert('Konfimasyon an pa menm ak nouvo kòd sekrè a.'); return; }
        if(p === cur){ await showAlert('Chwazi yon kòd sekrè diferan de sa w gen kounye a.'); return; }
        if(!FIREBASE_ENABLED || !fbAuth || !fbAuth.currentUser){ await showAlert('Ou dwe konekte pou chanje kòd sekrè ou.'); return; }
        try{
          const credential = firebase.auth.EmailAuthProvider.credential(fbAuth.currentUser.email, cur);
          await fbAuth.currentUser.reauthenticateWithCredential(credential);
          await fbAuth.currentUser.updatePassword(p);
          await showAlert('Kòd sekrè chanje.');
          render('admin');
        }catch(err){
          await showAlert(err && err.code==='auth/wrong-password' ? 'Kòd sekrè aktyèl la pa bon.' : firebaseAuthErrorMessage(err));
        }
      });
      const delAccForm = document.getElementById('del-account-form');
      if(delAccForm) delAccForm.addEventListener('submit', async e=>{
        e.preventDefault();
        const pass = document.getElementById('del-acc-pass').value;
        const meNow = currentAdmin();
        const rec = DATA.admins.find(a=>a.username===meNow.username);
        if(!rec) return;
        if(!FIREBASE_ENABLED || !fbAuth || !fbAuth.currentUser){ await showAlert('Ou dwe konekte pou efase kont ou.'); return; }
        const lastAdmin = (DATA.admins||[]).length<=1;
        const warn = lastAdmin
          ? `Sa a se sèl kont administratè lekòl la. Si w efase l, pa gen okenn admin ki ap ka konekte ankò. Kontinye?`
          : `Ou sou wè efase kont "${rec.username}" pou tout tan. Aksyon sa a PA ka defèt. Kontinye?`;
        if(!await showConfirm(warn)) return;
        try{
          const credential = firebase.auth.EmailAuthProvider.credential(fbAuth.currentUser.email, pass);
          await fbAuth.currentUser.reauthenticateWithCredential(credential);
          await fbAuth.currentUser.delete();
        }catch(err){
          await showAlert(err && err.code==='auth/wrong-password' ? 'Kòd sekrè a pa bon.' : firebaseAuthErrorMessage(err));
          return;
        }
        DATA.admins = DATA.admins.filter(a=>a.id!==rec.id);
        await saveData();
        await ensureBaselineAuth();
        session = {role:null, classId:null, teacherId:null, adminUsername:null};
        ui.authMode = null; ui.errors={};
        await showAlert('Kont ou efase.');
        render('login');
      });
    }

    if(ui.adminView==='docs'){
      const clsSel = document.getElementById('doc-class-select');
      if(clsSel) clsSel.addEventListener('change', ()=>{
        ui.docsClassId = clsSel.value; ui.docsStudentId=null; ui.docsType=null; ui.docsTitle=null; ui.docsBody=null;
        ui.docsShowPreview=false; ui.docsPreviewed=false;
        render('admin');
      });
      const stSel = document.getElementById('doc-student-select');
      if(stSel) stSel.addEventListener('change', ()=>{
        ui.docsStudentId = stSel.value; ui.docsTitle=null; ui.docsBody=null;
        ui.docsShowPreview=false; ui.docsPreviewed=false;
        render('admin');
      });
      const typeSel = document.getElementById('doc-type-select');
      if(typeSel) typeSel.addEventListener('change', ()=>{
        ui.docsType = typeSel.value; ui.docsTitle=null; ui.docsBody=null;
        ui.docsShowPreview=false; ui.docsPreviewed=false;
        render('admin');
      });
      const tplSel = document.getElementById('doc-template-select');
      if(tplSel) tplSel.addEventListener('change', ()=>{
        ui.docsTemplate = tplSel.value;
        ui.docsShowPreview=false; ui.docsPreviewed=false;
        render('admin');
      });
      const colorSel = document.getElementById('doc-color-select');
      if(colorSel) colorSel.addEventListener('change', ()=>{
        ui.docsColor = colorSel.value;
        ui.docsShowPreview=false; ui.docsPreviewed=false;
        render('admin');
      });
      const fontSel = document.getElementById('doc-font-select');
      if(fontSel) fontSel.addEventListener('change', ()=>{
        ui.docsFont = fontSel.value;
        ui.docsShowPreview=false; ui.docsPreviewed=false;
        render('admin');
      });
      const titleInp = document.getElementById('doc-title-input');
      if(titleInp) titleInp.addEventListener('input', ()=>{
        ui.docsTitle = titleInp.value; ui.docsPreviewed=false;
        const pb=document.getElementById('doc-print-btn'); if(pb){ pb.disabled=true; pb.title='Klike Apèsi dabò pou verifye dokiman an'; }
        const note=document.getElementById('doc-stale-note'); if(note) note.style.display='block';
      });
      const bodyInp = document.getElementById('doc-body-input');
      if(bodyInp) bodyInp.addEventListener('input', ()=>{
        ui.docsBody = bodyInp.value; ui.docsPreviewed=false;
        const pb=document.getElementById('doc-print-btn'); if(pb){ pb.disabled=true; pb.title='Klike Apèsi dabò pou verifye dokiman an'; }
        const note=document.getElementById('doc-stale-note'); if(note) note.style.display='block';
      });
      const previewBtn = document.getElementById('doc-preview-btn');
      if(previewBtn) previewBtn.addEventListener('click', ()=>{
        if(titleInp) ui.docsTitle = titleInp.value;
        if(bodyInp) ui.docsBody = bodyInp.value;
        ui.docsShowPreview = true; ui.docsPreviewed = true;
        render('admin');
      });
      const printBtn = document.getElementById('doc-print-btn');
      if(printBtn) printBtn.addEventListener('click', ()=>{
        const cls = findClass(ui.docsClassId);
        const st = cls && (cls.students||[]).find(s=>s.id===ui.docsStudentId);
        if(!cls || !st) return;
        paidThen({docTemplate:ui.docsTemplate, docFont:ui.docsFont}, ()=>{
          printOfficialDocument(cls, st, ui.docsTitle, ui.docsBody, ui.docsTemplate, ui.docsColor, ui.docsFont);
        });
      });
    }
  }

  else if(view==='teacher'){
    const doLogout = async ()=>{
      if(FIREBASE_ENABLED && fbAuth){ try{ await fbAuth.signOut(); }catch(e){} await ensureBaselineAuth(); }
      session={role:null,classId:null,teacherId:null,adminUsername:null}; render('login');
    };
    document.getElementById('logout').addEventListener('click', doLogout);
    const ls = document.getElementById('logout-side'); if(ls) ls.addEventListener('click', doLogout);
    document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click', ()=>{ ui.teacherView=b.dataset.nav; ui.classTab='eleve'; render('teacher'); }));
    const teacher = findTeacherById(session.teacherId);
    document.querySelectorAll('[data-pick-class]').forEach(b=>b.addEventListener('click', ()=>{
      session.classId = b.dataset.pickClass; ui.teacherView='klas'; ui.classTab='eleve'; render('teacher');
    }));
    const backHome = document.getElementById('back-to-teacher-home');
    if(backHome) backHome.addEventListener('click', ()=>{ ui.teacherView='akey'; render('teacher'); });
    if(ui.teacherView==='klas') wireClassManager(findClass(session.classId), 'teacher');
    if(ui.teacherView==='mesaj'){
      const unreadMsgs = ensureMessages().filter(m=>m.teacherId===teacher.id && m.sender==='admin' && !m.read);
      if(unreadMsgs.length){ unreadMsgs.forEach(m=>m.read=true); saveData(); }
      const cf = document.getElementById('msg-compose-form');
      if(cf) cf.addEventListener('submit', async e=>{
        e.preventDefault();
        const ta = document.getElementById('msg-compose-text');
        const text = ta.value.trim();
        if(!text) return;
        ensureMessages().push({id:uid(), teacherId:teacher.id, sender:'teacher', text, ts:Date.now(), read:false, editedAt:null, deletedFor:[], deletedForEveryone:false});
        await saveData();
        render('teacher');
      });
      const bub = document.getElementById('msg-bubbles');
      if(bub) bub.scrollTop = bub.scrollHeight;
      wireMessageThread(teacher.id, 'teacher', ()=>render('teacher'));
    }
    if(ui.teacherView==='pwofil'){
      const tp = teacher;
      document.getElementById('teacher-username-form').addEventListener('submit', async e=>{
        e.preventDefault();
        const newName = document.getElementById('tp-username').value.trim();
        if(!newName) return;
        if(newName!==tp.username && !await showConfirm(`Chanje non itilizatè ou pou "${newName}"?`)) return;
        tp.username = newName;
        await saveData();
        render('teacher');
      });
      document.getElementById('teacher-profile-form').addEventListener('submit', async e=>{
        e.preventDefault();
        tp.prenom = document.getElementById('tp-prenom').value.trim();
        tp.nom = document.getElementById('tp-nom').value.trim();
        tp.sexe = document.getElementById('tp-sexe').value;

        tp.address = document.getElementById('tp-address').value.trim();
        tp.poste = document.getElementById('tp-poste').value.trim();
        tp.diplome = document.getElementById('tp-diplome').value.trim();
        const exp = document.getElementById('tp-experience').value;
        tp.experience = exp===''? null : Number(exp);

      const teacherPhotoInput = document.getElementById('teacher-photo-input');
      if(teacherPhotoInput) teacherPhotoInput.addEventListener('change', async e=>{

      });

            teacherNotifSw.checked = false;

          }
        }
        ui.notifDesktop = teacherNotifSw.checked;
        await saveNotifPref(ui.notifDesktop);

}

function wireClassManager(cls, role){
  document.querySelectorAll('[data-ctab]').forEach(b=>b.addEventListener('click', ()=>{ ui.classTab=b.dataset.ctab; role==='admin'? render('admin') : render('teacher'); }));
  const tab = ui.classTab||'eleve';
  if(tab==='eleve'){
    document.getElementById('new-student-form').addEventListener('submit', async e=>{
      e.preventDefault();
      const name = document.getElementById('ns-name').value.trim();
      if(!name){ await showAlert('Non elèv la pa ka vid.'); return; }
      const matricule = document.getElementById('ns-matricule').value.trim();
      const sexe = document.getElementById('ns-sexe').value;
      const dob = document.getElementById('ns-dob').value;
      const dup = cls.students.some(s=>
        normSearch(s.name)===normSearch(name) ||
        (matricule && s.matricule && normSearch(s.matricule)===normSearch(matricule))
      );
      if(dup && !await showConfirm('Un élève similaire existe déjà. Voulez-vous continuer ?')) return;
      cls.students.push({id:uid(), name, matricule, sexe, dob});
      await saveData(); role==='admin'? render('admin') : render('teacher');
    });
    const stSearch = document.getElementById('student-search');
    if(stSearch) stSearch.addEventListener('input', ()=>{ ui.studentSearch = stSearch.value; refreshStudentList(cls, role); });
    const stSort = document.getElementById('student-sort');
    if(stSort) stSort.addEventListener('change', ()=>{ ui.studentSort = stSort.value; refreshStudentList(cls, role); });
    const stClear = document.getElementById('student-search-clear');
    if(stClear) stClear.addEventListener('click', ()=>{ ui.studentSearch=''; if(stSearch) stSearch.value=''; refreshStudentList(cls, role); stSearch && stSearch.focus(); });
    bindStudentRowDelete(cls, role);
  }
  else if(tab==='matye'){
    const ctmForm = document.getElementById('class-teacher-mode-form');
    if(ctmForm){
      const ctmModeSel = document.getElementById('ctm-mode');
      const ctmSingleWrap = document.getElementById('ctm-single-wrap');
      const syncCtmWrap = ()=>{ ctmSingleWrap.style.display = ctmModeSel.value==='multiple' ? 'none' : ''; };
      ctmModeSel.addEventListener('change', syncCtmWrap);
      syncCtmWrap();
      ctmForm.addEventListener('submit', async e=>{
        e.preventDefault();
        const newMode = ctmModeSel.value==='multiple' ? 'multiple' : 'single';
        if(newMode==='single'){
          const nameInput = document.getElementById('ctm-teacher').value.trim();
          cls.teacherMode = 'single';
          if(nameInput){
            const teacher = await resolveOrCreateTeacherFromName(nameInput);
            if(teacher){ cls.teacherId = teacher.id; cls.teacherName = teacherDisplayName(teacher); }
            await announceIfNewTeacher(teacher);
          } else {
            cls.teacherId = null; cls.teacherName = '';
          }
        } else {
          cls.teacherMode = 'multiple';
        }
        await saveData();
        role==='admin'? render('admin') : render('teacher');
      });
    }
    const newSubjectForm = document.getElementById('new-subject-form');
    if(newSubjectForm) newSubjectForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const sub = document.getElementById('ns-subject').value.trim();
      if(!sub){ await showAlert('Non matyè a pa ka vid.'); return; }
      const coefRaw = document.getElementById('ns-coef').value.trim();
      const coefNum = Number(coefRaw);
      if(coefRaw==='' || !Number.isFinite(coefNum) || coefNum<=0){ await showAlert('Antre yon barèm (kowefisyan) valab, pi gran pase 0.'); return; }
      if(cls.subjects.some(s=>normSearch(s.name)===normSearch(sub))){
        await showAlert('Yon matyè ki gen menm non an deja egziste nan klas sa a.');
        return;
      }
      let subjectTeacherId = null;
      if(cls.teacherMode==='multiple'){
        const nsTeacherEl = document.getElementById('ns-teacher');
        const teacherNameInput = nsTeacherEl ? nsTeacherEl.value.trim() : '';
        if(teacherNameInput){
          const teacher = await resolveOrCreateTeacherFromName(teacherNameInput);
          if(teacher) subjectTeacherId = teacher.id;
          await announceIfNewTeacher(teacher);
        }
      }
      cls.subjects.push({id:uid(), name:sub, coef:coefNum, teacherId:subjectTeacherId});
      await saveData(); role==='admin'? render('admin') : render('teacher');
    });
    const sjSearch = document.getElementById('subject-search');
    if(sjSearch) sjSearch.addEventListener('input', ()=>{ ui.subjectSearch = sjSearch.value; refreshSubjectList(cls, role); });
    const sjClear = document.getElementById('subject-search-clear');
    if(sjClear) sjClear.addEventListener('click', ()=>{ ui.subjectSearch=''; if(sjSearch) sjSearch.value=''; refreshSubjectList(cls, role); sjSearch && sjSearch.focus(); });
    bindSubjectRowEvents(cls, role);
  }
  else if(tab==='note'){
    const tp = document.getElementById('term-picker');
    if(tp) tp.addEventListener('change', ()=>{ ui.term = tp.value; role==='admin'? render('admin') : render('teacher'); });
    document.querySelectorAll('.grade-input').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        debounceSave(inp, async ()=>{
          const term = ui.term || DATA.terms[0];
          const studentId = inp.dataset.gradeStudent, subjectId = inp.dataset.gradeSubject;
          const raw = inp.value.trim();
          if(raw==='') return; // pa efase anyen pandan w ap tape — sa fèt sèlman lè w kite chan an
          const sub = cls.subjects.find(s=>s.id===subjectId);
          const maxPts = sub ? (sub.coef||1) : 100;
          const num = Number(raw);
          if(!Number.isFinite(num) || num<0 || num>maxPts) return; // pa anrejistre yon valè pa valab pandan w ap tape toujou
          const slot = ensureGradeSlot(cls, term, studentId);
          slot[subjectId] = num;
          await saveData();
        }, 800);
      });
      inp.addEventListener('change', async ()=>{
        const term = ui.term || DATA.terms[0];
        const studentId = inp.dataset.gradeStudent, subjectId = inp.dataset.gradeSubject;
        const raw = inp.value.trim();
        if(raw===''){
          const slot = ensureGradeSlot(cls, term, studentId);
          delete slot[subjectId];
          await saveData();
        } else {
          const sub = cls.subjects.find(s=>s.id===subjectId);
          const maxPts = sub ? (sub.coef||1) : 100;
          const num = Number(raw);
          if(!Number.isFinite(num)){
            await showAlert('Antre yon valè nimerik valab pou nòt la.');
            return;
          }
          if(num < 0){
            await showAlert('Nòt la pa ka negatif.');
            return;
          }
          if(num > maxPts){
            await showAlert(`Nòt la pa ka depase ${maxPts}.`);
            return;
          }
          const slot = ensureGradeSlot(cls, term, studentId);
          slot[subjectId] = num;
          await saveData();
        }
        const totalCell = document.querySelector(`[data-total-for="${studentId}"]`);
        if(totalCell){
          const {sumPoints, totalMax} = studentGradeTotal(cls, term, studentId);
          totalCell.innerHTML = `<strong>${sumPoints}</strong> / ${totalMax}`;
        }
      });
    });
  }
  else if(tab==='palmares'){
    const rerender = ()=>{ role==='admin'? render('admin') : render('teacher'); };
    const tp2 = document.getElementById('term-picker-2');
    if(tp2) tp2.addEventListener('change', ()=>{ ui.term = tp2.value; rerender(); });
    const pb = document.getElementById('print-palmares');
    if(pb) pb.addEventListener('click', ()=>{
      paidThen({palmaresStyle:getPrintStyle('palmares')}, ()=>{ printPalmares(cls, ui.term||DATA.terms[0]); });
    });
    const ppv = document.getElementById('preview-palmares');
    if(ppv) ppv.addEventListener('click', ()=>{ ui.palmaresShowPreview = !ui.palmaresShowPreview; rerender(); });
    const bs = document.getElementById('bulletin-student');
    if(bs) bs.addEventListener('change', ()=>{ ui.bulletinStudentId = bs.value; rerender(); });
    const pbb = document.getElementById('print-bulletin');
    if(pbb) pbb.addEventListener('click', ()=>{
      const sid = document.getElementById('bulletin-student').value;
      paidThen({bulletinStyle:getPrintStyle('bulletin')}, ()=>{ printBulletin(cls, ui.term||DATA.terms[0], sid); });
    });
    const bpv = document.getElementById('preview-bulletin');
    if(bpv) bpv.addEventListener('click', ()=>{
      ui.bulletinStudentId = document.getElementById('bulletin-student').value;
      ui.bulletinShowPreview = !ui.bulletinShowPreview; rerender();
    });
    const pgb = document.getElementById('print-general-bulletin');
    if(pgb) pgb.addEventListener('click', ()=>{
      const sid = document.getElementById('bulletin-student').value;
      paidThen({bulletinStyle:getPrintStyle('bulletin')}, ()=>{ printGeneralBulletin(cls, sid); });
    });
    /* Chanje estil (palmarès/bilten) rafrechi apèsi a si l ap afiche kounye a,
       san sa pa afekte lòt vi kote menm klas selèkt la ka egziste. */
    document.querySelectorAll('.print-style-select').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const key = sel.getAttribute('data-print-style-key');
        setPrintStyle(key, sel.value); /* menm si delegasyon global la ap fè l tou, sa asire apèsi a li dènye chwa a */
        if(key==='palmares' && ui.palmaresShowPreview) rerender();
        else if(key==='bulletin' && ui.bulletinShowPreview) rerender();
      });
    });
  }
  else if(tab==='fich'){
    const fs = document.getElementById('fiche-student');
    if(fs) fs.addEventListener('change', ()=>{ ui.ficheStudentId = fs.value; role==='admin'? render('admin') : render('teacher'); });
    const ft = document.getElementById('fiche-term');
    if(ft) ft.addEventListener('change', ()=>{ ui.term = ft.value; role==='admin'? render('admin') : render('teacher'); });
    const pf = document.getElementById('print-fiche');
    if(pf) pf.addEventListener('click', ()=> printFiche(cls, ui.term||DATA.terms[0], ui.ficheStudentId));
    const photoInput = document.getElementById('fiche-photo-input');
    if(photoInput) photoInput.addEventListener('change', async e=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      try{
        const dataUrl = await resizeImageToDataUrl(file, 320, 0.82);
        const st = cls.students.find(s=>s.id===ui.ficheStudentId);
        if(st){ st.photo = dataUrl; await saveData(); role==='admin'? render('admin') : render('teacher'); }
      }catch(err){ await showAlert('Pa t kapab chaje imaj sa a.'); }
    });
    const photoRemove = document.getElementById('fiche-photo-remove');
    if(photoRemove) photoRemove.addEventListener('click', async ()=>{
      const st = cls.students.find(s=>s.id===ui.ficheStudentId);
      if(st){ delete st.photo; await saveData(); role==='admin'? render('admin') : render('teacher'); }
    });
  }
  else if(tab==='ore'){
    const sch = ensureSchedule(cls);
    document.querySelectorAll('[data-sch-field]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        debounceSave(inp, async ()=>{
          const row = sch.rows.find(r=>r.id===inp.dataset.schRow);
          if(row){ row[inp.dataset.schField] = inp.value.trim(); await saveData(); }
        }, 800);
      });
      inp.addEventListener('change', async ()=>{
        const row = sch.rows.find(r=>r.id===inp.dataset.schRow);
        if(row){ row[inp.dataset.schField] = inp.value.trim(); await saveData(); }
      });
    });
    document.querySelectorAll('[data-del-schedule-row]').forEach(b=>b.addEventListener('click', async ()=>{
      sch.rows = sch.rows.filter(r=>r.id!==b.dataset.delScheduleRow);
      await saveData(); role==='admin'? render('admin') : render('teacher');
    }));
    const addRow = document.getElementById('add-schedule-row');
    if(addRow) addRow.addEventListener('click', async ()=>{
      sch.rows.push({id:uid(), time:'', lendi:'', madi:'', mèkredi:'', jedi:'', vandredi:''});
      await saveData(); role==='admin'? render('admin') : render('teacher');
    });
    const printSch = document.getElementById('print-schedule');
    if(printSch) printSch.addEventListener('click', ()=> printSchedule(cls));
  }
}

boot();
</script>
</body>
</html>
