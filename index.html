<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Playfair+Display:wght@600;700&family=Nunito:wght@500;700&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1877F2;
    --blue-dark:#166FE0;
    --blue-soft:#E7F0FE;
    --bg:#F0F2F5;
    --card:#FFFFFF;
    --text:#050505;
    --text-soft:#65676B;
    --text-faint:#8A8D91;
    --line:#DADDE1;
    --line-soft:#E4E6EA;
    --red:#E4433D;
    --gold:#C79A3B;
    --green:#42B72A;
    --radius:8px;
    --shadow:0 1px 2px rgba(0,0,0,.08), 0 1px 6px rgba(0,0,0,.06);
    --shadow-pop:0 12px 28px rgba(0,0,0,.18), 0 2px 4px rgba(0,0,0,.1);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:"kern" 1,"liga" 1;line-height:1.45;}
  h1,h2,h3{margin:0;line-height:1.25;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  svg.ic{width:19px;height:19px;flex-shrink:0;}

  /* ============ AUTH (login / signup) ============ */
  .auth-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
  .auth-brand .logo{width:44px;height:44px;border-radius:10px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;}
  .auth-brand .bn{font-size:22px;font-weight:800;color:var(--blue);letter-spacing:-.01em;}
  .auth-wrap{display:flex;gap:40px;align-items:center;max-width:900px;width:100%;justify-content:center;flex-wrap:wrap;}
  .auth-pitch{max-width:380px;}
  .auth-pitch h2{font-size:25px;line-height:1.35;color:var(--text);font-weight:700;}
  .auth-card{background:var(--card);border-radius:12px;box-shadow:var(--shadow-pop);padding:26px 26px 22px;width:100%;max-width:360px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--text-soft);margin-bottom:5px;font-weight:600;line-height:1.4;}
  .field input,.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;font-size:15px;background:#fff;transition:border-color .15s, box-shadow .15s;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
  .pass-wrap{position:relative;}
  .pass-wrap input{padding-right:42px;}
  .pass-toggle{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:6px;color:var(--text-soft);cursor:pointer;padding:0;}
  .pass-toggle:hover{background:var(--blue-soft);color:var(--blue);}
  .pass-toggle .ic{width:19px;height:19px;}
  .conn-dot{position:fixed;top:10px;right:10px;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.15);z-index:9999;transition:background-color .2s, border-color .2s;}
  .conn-dot.is-online{background:var(--green);border-color:var(--green);box-shadow:0 0 0 3px rgba(66,183,42,.25);}
  .conn-dot.is-offline{background:#fff;border-color:#bbb;}
  .nav-badge{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1;}
  .nav-icon-btn{position:relative;}
  .sb-link{position:relative;}
  .sb-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
  .msg-layout{display:flex;gap:16px;align-items:flex-start;}
  .msg-convo-list{width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;}
  .msg-convo-item{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:10px;border:none;cursor:pointer;background:transparent;text-align:left;width:100%;}
  .msg-convo-item:hover{background:var(--bg);}
  .msg-convo-item.active{background:var(--blue-soft);}
  .msg-convo-item.unread .nm, .msg-convo-item.unread .sub{font-weight:800;color:var(--text);}
  .msg-convo-item .nm{font-weight:600;font-size:14.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .msg-convo-item .sub{font-size:12.5px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .msg-avatar{width:48px;height:48px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;overflow:hidden;}
  .msg-avatar.sm{width:38px;height:38px;font-size:13px;}
  .msg-thread{flex:1;min-width:0;}
  .msg-thread-head{display:flex;align-items:center;gap:12px;padding:4px 4px 14px;cursor:pointer;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .msg-thread-head .nm{font-weight:700;font-size:15px;color:var(--text);}
  .msg-thread-head .sub{font-size:12px;color:var(--blue);font-weight:600;}
  .msg-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--blue);cursor:pointer;margin-bottom:12px;}
  .msg-bubbles{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding:6px 2px;margin-bottom:12px;}
  .msg-bubble{max-width:100%;padding:9px 13px;border-radius:12px;font-size:14px;line-height:1.5;min-width:0;}
  .msg-bubble.mine{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:3px;}
  .msg-bubble.theirs{align-self:flex-start;background:#F0F2F5;color:var(--text);border-bottom-left-radius:3px;}
  .msg-bubble .meta{display:block;font-size:10.5px;opacity:.75;margin-top:4px;}
  .msg-compose{display:flex;gap:8px;}
  .msg-compose textarea{flex:1;resize:none;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  .msg-row{display:flex;align-items:flex-end;gap:7px;max-width:84%;align-self:flex-start;min-width:0;}
  .msg-row.mine{flex-direction:row-reverse;align-self:flex-end;}
  .msg-row-av{width:24px;height:24px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#fff;}
  .msg-row-av img{width:100%;height:100%;object-fit:cover;}
  .msg-bubble{cursor:pointer;}
  .msg-bubble.deleted{cursor:default;font-style:italic;opacity:.65;background:transparent;border:1px dashed var(--line);color:var(--text-soft);}
  .msg-bubble.mine.deleted{background:transparent;}
  .msg-bubble .meta .edited-tag{opacity:.9;}
  .msg-bubble.editing{cursor:default;padding:8px;}
  .msg-edit-textarea{width:100%;min-width:180px;resize:none;min-height:44px;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:7px 9px;font-size:14px;font-family:inherit;background:rgba(255,255,255,.15);color:inherit;}
  .msg-bubble.theirs .msg-edit-textarea{background:#fff;border:1px solid var(--line);color:var(--text);}
  .msg-edit-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}
  .msg-edit-actions button{border:none;background:rgba(0,0,0,.12);color:inherit;padding:5px 12px;border-radius:14px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .msg-bubble.theirs .msg-edit-actions button{background:var(--bg);color:var(--text);}
  .msg-action-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
  .msg-action-sheet{background:#fff;width:100%;max-width:420px;border-radius:16px 16px 0 0;padding:6px 0 max(6px,env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.18);}
  .msg-action-btn{display:block;width:100%;text-align:left;padding:14px 20px;border:none;background:none;font-size:15px;cursor:pointer;color:var(--text);border-bottom:1px solid var(--line);}
  .msg-action-btn:last-child{border-bottom:none;}
  .msg-action-btn.danger{color:#D93025;}
  .msg-action-btn.cancel{text-align:center;font-weight:700;color:var(--text-soft);}
  @media (max-width:900px){
    .msg-layout{flex-direction:column;}
    .msg-layout.has-open .msg-convo-list{display:none;}
    .msg-layout:not(.has-open) .msg-thread{display:none;}
    .msg-convo-list{width:100%;}
  }
  @media (min-width:901px){ .msg-back{display:none;} }
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;font-weight:700;transition:background .15s, box-shadow .15s, transform .1s;}
  .btn-pill{border-radius:22px;padding:11px 20px;font-size:15px;min-height:44px;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-primary:active{transform:translateY(1px);}
  .btn-block{width:100%;}
  .btn-ghost{background:var(--blue-soft);color:var(--blue);}
  .btn-ghost:hover{background:#DCEAFE;}
  .divider-word{display:flex;align-items:center;gap:10px;color:var(--text-faint);font-size:12.5px;margin:16px 0;}
  .divider-word::before,.divider-word::after{content:"";flex:1;height:1px;background:var(--line);}
  .role-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--bg);padding:4px;border-radius:8px;}
  .role-tab{flex:1;padding:8px;text-align:center;border-radius:6px;border:none;background:transparent;font-size:13.5px;font-weight:700;color:var(--text-soft);transition:background .15s,color .15s;}
  .role-tab.active{background:#fff;color:var(--blue);box-shadow:var(--shadow);}
  .error-msg{color:var(--red);font-size:13px;margin:-4px 0 12px;font-weight:600;line-height:1.5;}
  .hint{font-size:12px;color:var(--text-faint);margin-top:14px;line-height:1.6;text-align:center;}
  @media (max-width:760px){ .auth-pitch{display:none;} }

  /* ============ APP SHELL (FB style) ============ */
  .fb-nav{position:sticky;top:0;z-index:20;height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
  .fb-nav-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .fb-nav-left .logo{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .fb-nav-left .bn{font-size:16px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px;}
  .fb-nav-mid{display:flex;align-items:center;gap:4px;}
  .nav-icon-btn{position:relative;width:64px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--text-soft);}
  .nav-icon-btn:hover{background:var(--bg);}
  .nav-icon-btn.active{color:var(--blue);}
  .nav-icon-btn.active::after{content:"";position:absolute;bottom:0;left:8px;right:8px;height:3px;background:var(--blue);border-radius:3px 3px 0 0;}
  .nav-icon-btn svg{width:22px;height:22px;}
  .fb-nav-right{display:flex;align-items:center;gap:8px;}
  .icon-round-btn{width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;border:none;}
  .icon-round-btn:hover{background:var(--line-soft);}
  .nav-avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
  @media (max-width:720px){ .fb-nav-left .bn{display:none;} .nav-icon-btn{width:46px;} }

  .fb-body{display:flex;align-items:flex-start;gap:16px;max-width:1220px;margin:0 auto;padding:16px;}
  .fb-sidebar{width:270px;flex-shrink:0;position:sticky;top:72px;}
  .sb-card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:8px;margin-bottom:14px;}
  .sb-profile{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:8px;margin-bottom:4px;}
  .sb-profile .av{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .sb-profile .nm{font-size:14.5px;font-weight:700;color:var(--text);line-height:1.3;}
  .sb-profile .rl{font-size:12px;color:var(--text-soft);line-height:1.4;}
  .sb-link{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:8px;font-size:14.5px;font-weight:600;color:var(--text);}
  .sb-link .ic-wrap{width:32px;height:32px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sb-link:hover{background:var(--bg);}
  .sb-link.active{background:var(--blue-soft);}
  .sb-link.active .ic-wrap{background:var(--blue);color:#fff;}
  .sb-link.danger .ic-wrap{background:#FDECEC;color:var(--red);}
  @media (max-width:900px){ .fb-sidebar{display:none;} }

  .fb-bottom-nav{display:none;}
  @media (max-width:900px){
    .fb-nav-mid{display:none;}
    .fb-bottom-nav{
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:30;
      background:var(--card); border-top:1px solid var(--line);
      padding:4px 2px calc(4px + env(safe-area-inset-bottom));
      justify-content:space-around; align-items:center;
      overflow-x:hidden;
    }
    .fb-bottom-nav .nav-icon-btn{width:auto;min-width:0;flex:1 1 0;height:54px;flex-direction:column;gap:2px;font-size:9.5px;color:var(--text-soft);padding-left:1px;padding-right:1px;}
    .fb-bottom-nav .nav-icon-btn svg{width:20px;height:20px;flex-shrink:0;}
    .fb-bottom-nav .nav-icon-btn.active::after{bottom:auto;top:0;}
    .fb-bottom-nav .nav-icon-btn span.lbl{font-size:9.5px;font-weight:700;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    @media (max-width:400px){ .fb-bottom-nav .nav-icon-btn{font-size:8.5px;} .fb-bottom-nav .nav-icon-btn svg{width:18px;height:18px;} .fb-bottom-nav .nav-icon-btn span.lbl{font-size:8.5px;} }
    .fb-body{padding-bottom:76px;}
  }

  /* ============ FÒM BOUTON NAVIGASYON (anba, sou mobil) ============ */
  /* "Klasik" se konpòtman default ki deja egziste anwo a (okenn klas
     siplemantè bezwen). Lòt 4 estil yo aktive selon klas html.navstyle-*. */
  html.navstyle-pill .fb-bottom-nav .nav-icon-btn{border-radius:999px;margin:2px 3px;height:48px;}
  html.navstyle-pill .fb-bottom-nav .nav-icon-btn.active{background:var(--blue-soft);color:var(--blue);}
  html.navstyle-pill .fb-bottom-nav .nav-icon-btn.active::after{display:none;}
  html.navstyle-circle .fb-bottom-nav .nav-icon-btn{gap:4px;}
  html.navstyle-circle .fb-bottom-nav .nav-icon-btn svg{background:var(--bg);border-radius:50%;padding:6px;width:30px;height:30px;box-sizing:content-box;}
  html.navstyle-circle .fb-bottom-nav .nav-icon-btn.active svg{background:var(--blue);color:#fff;}
  html.navstyle-circle .fb-bottom-nav .nav-icon-btn.active::after{display:none;}
  @media (max-width:400px){ html.navstyle-circle .fb-bottom-nav .nav-icon-btn svg{padding:4px;width:24px;height:24px;} }
  html.navstyle-floating .fb-bottom-nav{gap:4px;padding-top:8px;}
  html.navstyle-floating .fb-bottom-nav .nav-icon-btn{border-radius:16px;transition:transform .12s ease;}
  html.navstyle-floating .fb-bottom-nav .nav-icon-btn.active{background:var(--card);box-shadow:0 4px 12px rgba(0,0,0,.18);transform:translateY(-5px);color:var(--blue);}
  html.navstyle-floating .fb-bottom-nav .nav-icon-btn.active::after{display:none;}
  html.navstyle-minimal .fb-bottom-nav .nav-icon-btn{height:44px;}
  html.navstyle-minimal .fb-bottom-nav .nav-icon-btn span.lbl{display:none;}
  html.navstyle-minimal .fb-bottom-nav .nav-icon-btn svg{width:24px;height:24px;}
  html.navstyle-minimal .fb-bottom-nav .nav-icon-btn.active::after{height:2px;}

  .fb-main{flex:1;min-width:0;max-width:880px;}
  /* ---- Tèt paj yo (Klas/Pwofesè/Rapò...) : yon tich serif klasik pou tit
     la, yon fen bare aksan koulè anba l, pou bay yon ton pi elegant/pi
     pwofesyonèl san l pa pèdi lizibilite modèn lan. ---- */
  .page-head{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line-soft);}
  .page-title{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:25px;font-weight:700;color:var(--text);letter-spacing:-.01em;line-height:1.3;position:relative;display:inline-block;padding-bottom:8px;}
  .page-title::after{content:"";position:absolute;left:0;bottom:0;width:46px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--gold));}
  .page-sub{color:var(--text-soft);font-size:13.5px;margin:12px 0 0;line-height:1.5;}
  .code-chip{font-family:ui-monospace,'SF Mono',Menlo,monospace;background:#FFF3D6;color:#7A5B06;padding:3px 9px;border-radius:5px;letter-spacing:.06em;font-size:13px;border:1px solid #F0DFA6;}

  .card{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;box-shadow:var(--shadow);padding:20px 20px 22px;margin-bottom:16px;transition:box-shadow .18s ease;}
  .card-head{display:flex;align-items:center;gap:11px;margin-bottom:16px;padding-bottom:13px;border-bottom:1px solid var(--line-soft);}
  .card-head .ic-wrap{width:32px;height:32px;border-radius:9px;background:linear-gradient(150deg,var(--blue-soft),var(--blue-soft) 60%,rgba(24,119,242,.18));color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .card-head h3{margin:0;font-family:'Fraunces',Georgia,serif;font-size:16px;color:var(--text);font-weight:700;line-height:1.3;letter-spacing:-.005em;}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
  .stat-box{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow);padding:16px 16px 15px;position:relative;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease;}
  .stat-box::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--gold));}
  .stat-box:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop);}
  .stat-box .stat-ic{width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .stat-box .num{font-family:'Fraunces',Georgia,serif;font-size:27px;color:var(--text);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
  .stat-box .lbl{font-size:12px;color:var(--text-soft);margin-top:6px;line-height:1.4;text-transform:uppercase;letter-spacing:.04em;font-weight:600;}

  /* ============ CLASS CARDS (no horizontal scroll ever) ============ */
  .class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .class-card{background:var(--card);border:1px solid var(--line-soft);border-radius:13px;padding:16px 16px 16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .class-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--gold));opacity:.85;}
  .class-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop);border-color:var(--line);}
  .class-card-top{display:flex;align-items:center;gap:11px;min-width:0;}
  .class-card-ic{width:38px;height:38px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .class-card-name{font-family:'Fraunces',Georgia,serif;font-size:16px;font-weight:700;color:var(--text);word-break:break-word;line-height:1.3;}
  .class-card-teacher{font-size:12.5px;color:var(--text-soft);margin-top:2px;word-break:break-word;line-height:1.4;}
  .class-card-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .class-card-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--text-soft);background:var(--bg);border:1px solid var(--line-soft);border-radius:20px;padding:4px 10px;}
  .class-card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px;padding-top:10px;border-top:1px dashed var(--line-soft);}

  table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;}
  th,td{padding:11px 12px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:middle;line-height:1.4;}
  th{color:var(--text-faint);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:var(--bg);}
  th:first-child{border-top-left-radius:9px;}
  th:last-child{border-top-right-radius:9px;}
  td{font-variant-numeric:tabular-nums;}
  tbody tr{transition:background-color .12s ease;}
  tbody tr:nth-child(even){background:rgba(24,119,242,.025);}
  tbody tr:hover{background:var(--blue-soft);}
  tr:last-child td{border-bottom:none;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .inline-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:2px;}
  .inline-form .field{margin-bottom:0;flex:1;min-width:160px;}
  .tab-strip{display:flex;gap:2px;margin-bottom:18px;background:var(--card);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow);padding:6px;flex-wrap:wrap;}
  .tab-btn{display:flex;align-items:center;gap:7px;padding:10px 15px;font-size:13.5px;font-weight:700;color:var(--text-soft);background:none;border:none;border-radius:8px;transition:background .15s,color .15s,box-shadow .15s;}
  .tab-btn:hover{background:var(--bg);}
  .tab-btn.active{color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px rgba(24,119,242,.25);}
  .grade-input{width:60px;padding:6px 7px;border:1px solid var(--line);border-radius:6px;text-align:center;font-size:13.5px;}
  .grade-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
  .subject-edit-input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;background:var(--card);color:var(--text);width:100%;min-width:110px;}
  .subject-edit-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
  .subject-coef-input{max-width:80px;text-align:center;}
  .empty-state{padding:34px 10px;text-align:center;color:var(--text-faint);font-size:14px;line-height:1.5;}
  .term-select{padding:8px 11px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:13px;font-weight:600;}

  /* ============ RECHERCHE & FILTÈ ============ */
  .hidden{display:none !important;}
  .search-filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .search-box{position:relative;flex:1;min-width:200px;}
  .search-box input{width:100%;padding:9px 34px 9px 12px;border:1px solid var(--line);border-radius:20px;font-size:13.5px;background:#fff;}
  .search-box input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
  .search-clear-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:none;background:var(--line-soft);color:var(--text-soft);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
  .search-clear-btn:hover{background:var(--line);}
  .search-clear-btn.hidden{display:none;}
  .result-count{font-size:12.5px;color:var(--text-faint);font-weight:600;margin:-4px 0 10px;}
  @media (max-width:600px){ .search-filter-bar{flex-direction:column;align-items:stretch;} .search-filter-bar .term-select{width:100%;} }
  .avg-cell{font-weight:800;color:var(--blue);}
  .rank-pill{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;background:var(--bg);color:var(--text-soft);border-radius:20px;font-weight:800;font-size:12.5px;}
  .rank-pill.top1{background:linear-gradient(145deg,#F3D06B,var(--gold));color:#4A3A0A;}
  .rank-pill.top2{background:#DCE2EC;color:#33475b;}
  .rank-pill.top3{background:#E9D9C4;color:#6b4b1c;}
  .person{display:flex;align-items:center;gap:9px;}
  .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line-soft);}
  .name-cell-txt{font-weight:600;}

  .btn-small{padding:7px 13px;font-size:13px;font-weight:700;border-radius:16px;border:none;background:var(--blue-soft);color:var(--blue);display:inline-flex;align-items:center;gap:6px;transition:background .15s,transform .1s;}
  .btn-small:hover{background:#DCEAFE;transform:translateY(-1px);}
  .btn-danger-outline{background:#FDECEC;color:var(--red);}
  .btn-danger-outline:hover{background:#FBDCDB;}

  /* podium */
  .podium-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .podium-card{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow);padding:18px 16px;text-align:center;transition:transform .15s ease,box-shadow .15s ease;}
  .podium-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop);}
  .podium-medal{width:40px;height:40px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
  .medal-1{background:linear-gradient(145deg,#F3D06B,#C9A227);color:#3A2C00;}
  .medal-2{background:linear-gradient(145deg,#DADFE6,#AAB4C2);color:#2B2F36;}
  .medal-3{background:linear-gradient(145deg,#D9A06B,#B0713C);color:#3A1E00;}
  .podium-name{font-weight:700;font-size:14px;color:var(--text);line-height:1.3;}
  .podium-score{color:var(--text-soft);font-size:12.5px;margin-top:3px;line-height:1.4;font-variant-numeric:tabular-nums;}

  /* ============ PWOFIL ADMINISTRATÈ ============ */
  .profile-info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
  .profile-info-item{display:flex;align-items:flex-start;gap:12px;}
  .profile-info-item .pi-lbl{font-size:12px;color:var(--text-soft);font-weight:600;margin-bottom:2px;line-height:1.4;}
  .profile-info-item .pi-val{font-size:14.5px;color:var(--text);font-weight:700;word-break:break-word;line-height:1.4;}

  /* ============ DARK MODE ============ */
  html.theme-dark{
    --bg:#18191A; --card:#242526; --text:#E4E6EB; --text-soft:#B0B3B8; --text-faint:#8A8D91;
    --line:#3A3B3C; --line-soft:#3A3B3C; --blue-soft:#1D2B45;
  }
  html.theme-dark .code-chip{background:#3A2E0E;color:#F0DFA6;border-color:#5A4A1A;}
  html.theme-dark .btn-danger-outline{background:#3A1E1E;}
  html.theme-dark .grade-input,html.theme-dark .field input,html.theme-dark .field select,html.theme-dark .term-select,html.theme-dark .search-box input{background:var(--card);color:var(--text);border-color:var(--line);}
  html.theme-dark .search-clear-btn{background:#3A3B3C;color:var(--text-soft);}
  html.theme-dark .auth-card{background:var(--card);}
  html.theme-dark .role-tabs{background:var(--bg);}
  html.theme-dark .role-tab.active{background:var(--card);}

  /* ============ MENTION PILLS ============ */
  .mention-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:800;white-space:nowrap;}
  .mention-excelan{background:#E3F5E1;color:#1E7A2E;}
  .mention-trebyen{background:#E7F0FE;color:#1256B0;}
  .mention-byen{background:#EAF6EE;color:#237A45;}
  .mention-asebyen{background:#FFF3D6;color:#8A6206;}
  .mention-pasab{background:#FDE9D9;color:#A85400;}
  .mention-ensifizan{background:#FDECEC;color:#B3261E;}
  html.theme-dark .mention-excelan{background:#173822;color:#7BD98C;}
  html.theme-dark .mention-trebyen{background:#1D2B45;color:#8FB8F5;}
  html.theme-dark .mention-byen{background:#173425;color:#84D6A0;}
  html.theme-dark .mention-asebyen{background:#3A2E0E;color:#F0C96A;}
  html.theme-dark .mention-pasab{background:#3A2410;color:#F0A25A;}
  html.theme-dark .mention-ensifizan{background:#3A1E1E;color:#F09A94;}

  /* ============ THEME TOGGLE ============ */
  .theme-toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px;}
  .theme-toggle-row .ttxt{font-size:14px;color:var(--text);font-weight:600;}
  .theme-toggle-row .tsub{font-size:12.5px;color:var(--text-soft);margin-top:2px;}
  .switch{position:relative;width:46px;height:26px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;inset:0;background:var(--line);border-radius:26px;cursor:pointer;transition:background .15s;}
  .switch .slider::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;}
  .switch input:checked + .slider{background:var(--blue);}
  .switch input:checked + .slider::before{transform:translateX(20px);}

  /* ============ SCHEDULE (ORÈ) ============ */
  .schedule-wrap{overflow-x:auto;}
  .schedule-input{width:100%;min-width:90px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:var(--card);color:var(--text);}
  .schedule-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
  .schedule-time-input{min-width:105px;font-weight:700;}

  /* ============ FICH ELÈV ============ */
  .fiche-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .fiche-head .avatar-lg{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;flex-shrink:0;background-size:cover;background-position:center;}
  .avatar-photo-wrap{position:relative;width:64px;height:64px;flex-shrink:0;}
  .avatar-photo-wrap .avatar-lg{width:100%;height:100%;}
  .avatar-photo-btn{position:absolute;bottom:-2px;right:-2px;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;border:2px solid var(--card-bg,#fff);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .avatar-photo-btn svg{width:13px;height:13px;}
  .avatar-photo-remove{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--red,#e0245e);color:#fff;border:2px solid var(--card-bg,#fff);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .avatar-photo-remove svg.ic{width:11px;height:11px;}
  .avatar-photo-input{display:none;}
  .fiche-head .fiche-name{font-size:19px;font-weight:800;color:var(--text);line-height:1.3;}
  .fiche-head .fiche-meta{font-size:13px;color:var(--text-soft);margin-top:3px;line-height:1.5;}
  .fiche-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
  .fiche-stat{background:var(--bg);border-radius:8px;padding:12px 14px;}
  .fiche-stat .fv{font-size:18px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
  .fiche-stat .fl{font-size:11.5px;color:var(--text-faint);margin-top:3px;text-transform:uppercase;letter-spacing:.04em;}

  /* ============ HISTOGRAM ============ */
  .hist-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .hist-label{width:64px;flex-shrink:0;font-size:12px;color:var(--text-soft);font-weight:700;text-align:right;}
  .hist-track{flex:1;min-width:0;background:var(--bg);border-radius:7px;height:22px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line-soft);}
  .hist-fill{height:100%;background:linear-gradient(90deg,var(--blue),#3E8CF7);border-radius:7px;transition:width .3s;display:flex;align-items:center;}
  .hist-count{width:34px;flex-shrink:0;font-size:12.5px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
  .dash-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .dash-row:last-child{border-bottom:none;}
  .dash-row .drn{font-size:14px;font-weight:700;color:var(--text);line-height:1.3;}
  .dash-row .drm{font-size:12px;color:var(--text-soft);margin-top:1px;line-height:1.4;}
  .dash-avg-big{font-size:34px;font-weight:800;color:var(--blue);line-height:1;font-variant-numeric:tabular-nums;}
  .dash-avg-sub{font-size:12.5px;color:var(--text-soft);margin-top:6px;line-height:1.4;}
  .term-evol-label{width:112px;flex-shrink:0;font-size:12px;color:var(--text-soft);font-weight:700;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ============ PRINT STAMP (SVG seal) ============ */
  .p-stamp-svg{width:64px;height:64px;flex-shrink:0;}
  .p-stamp-img{width:64px;height:64px;flex-shrink:0;object-fit:contain;}
  #stamp-preview{width:150px;height:150px;display:flex;align-items:center;justify-content:center;background:var(--card,#fff);border:1px solid var(--border,#e3e3e3);border-radius:12px;padding:10px;}
  #stamp-preview svg{width:126px;height:126px;}
  .stamp-model-grid{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 6px;}
  .stamp-model-opt{border:1.5px solid var(--border,#dcdcdc);border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;background:transparent;color:var(--text-soft,#666);transition:all .15s;}
  .stamp-model-opt.active{border-color:var(--blue,#1c3a5e);color:var(--blue,#1c3a5e);background:rgba(28,58,94,.08);}

  /* ============ PRINT (kept official/serif) ============ */
  @page{ size:A4; margin:12mm 14mm; }
  #print-area{display:none;}
  @media print{
    html,body{background:#fff!important;}
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block;position:absolute;top:0;left:0;width:100%;padding:0;margin:0;background:#fff;}
    .no-print{display:none!important;}
  }
  .p-frame{border:2px solid var(--doc-primary, #16233F);padding:26px 30px;font-family:Georgia,'Times New Roman',serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;line-height:1.5;text-rendering:optimizeLegibility;}
  .p-header{display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--doc-primary, #16233F);padding-bottom:16px;margin-bottom:18px;page-break-inside:avoid;break-inside:avoid;}
  .p-crest{width:46px;height:46px;border-radius:50%;background:#16233F;color:#EFDFB8;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:16px;flex-shrink:0;}
  .p-header .p-school{font-family:'Fraunces',serif;font-size:21px;font-weight:700;color:var(--doc-primary, #16233F);letter-spacing:-.01em;line-height:1.3;}
  .p-header .p-sub{font-size:13px;color:#555;margin-top:3px;line-height:1.4;}
  .p-header .p-school-meta{font-size:11px;color:#666;margin-top:3px;line-height:1.5;}
  .p-meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:16px;color:#555;page-break-inside:avoid;break-inside:avoid;line-height:1.5;}
  .p-table{width:100%;border-collapse:collapse;font-size:13px;}
  .p-table th,.p-table td{border:1px solid #999;padding:8px 10px;word-break:break-word;line-height:1.4;}
  .p-table th{background:#EEF1F6;color:#16233F;letter-spacing:.02em;}
  .p-table thead{display:table-header-group;}
  .p-table tr{page-break-inside:avoid;break-inside:avoid;}
  .p-avgline{margin-top:18px;font-size:14px;border-top:1px solid #ccc;padding-top:14px;page-break-inside:avoid;break-inside:avoid;line-height:1.7;}
  .p-sign{display:flex;justify-content:space-between;margin-top:70px;font-size:12.5px;color:#555;page-break-inside:avoid;break-inside:avoid;line-height:1.4;}
  .p-sign div{border-top:1px solid #999;padding-top:6px;width:42%;}
  /* ---- Blòk siyati direktè a (itilize sou tout dokiman ofisyèl) : non
     direktè a parèt an fòm siyati (kaligrafi) DIRÈKTEMAN sou liy la, epi
     tit "Directeur / Directrice" ekri klè, an lèt nòmal, anba liy lan. ---- */
  .doc-sign-name{font-family:'Segoe Script','Brush Script MT','Lucida Handwriting',cursive;font-size:19px;line-height:1.15;min-height:24px;color:#1a1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .doc-sign-role{font-size:11px;letter-spacing:.03em;margin-top:4px;color:#555;}
  .p-doc-title{text-align:center;font-weight:700;font-size:16px;letter-spacing:.05em;margin:8px 0 24px;text-decoration:underline;text-underline-offset:6px;color:var(--doc-primary, #16233F);}
  .p-doc-body{font-size:14.5px;text-align:justify;line-height:1.9;font-weight:500;color:#242424;}
  .p-doc-body p{margin:0 0 14px 0;}
  .p-doc-date{margin-top:26px;font-size:13px;color:#555;text-align:right;page-break-inside:avoid;break-inside:avoid;}
  .doc-form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .doc-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .doc-body-textarea{width:100%;font-family:Georgia,'Times New Roman',serif;font-size:14px;line-height:1.7;padding:12px 14px;border-radius:6px;border:1px solid var(--line);resize:vertical;background:#fff;}
  html.theme-dark .doc-body-textarea{background:var(--card);color:var(--text);border-color:var(--line);}
  .doc-preview-card{background:var(--soft, #f4f6fa);}
  html.theme-dark .doc-preview-card{background:var(--card);}
  .doc-preview-scroll{overflow:auto;padding:4px;}

  /* ---- Modèle ÉLÉGANT (documents officiels) ---- */
  .doct-elegant{font-family:Georgia,'Times New Roman',serif;color:#232323;background:#fff;padding:30px 34px;border:3px double var(--doc-primary, #16233F);position:relative;}
  .doct-elegant .de-head{text-align:center;margin-bottom:4px;}
  .doct-elegant .de-stamp{margin:0 auto 8px;text-align:center;}
  .doct-elegant .de-school{font-size:20px;font-weight:700;letter-spacing:.06em;color:var(--doc-primary, #16233F);}
  .doct-elegant .de-meta{font-size:11.5px;color:#555;margin-top:3px;}
  .doct-elegant .de-divider{width:130px;height:3px;background:var(--doc-accent, #C9A227);margin:16px auto;border-radius:2px;}
  .doct-elegant .de-title{text-align:center;font-size:19px;font-weight:700;letter-spacing:.09em;color:var(--doc-primary, #16233F);margin:8px 0 26px;text-transform:uppercase;}
  .doct-elegant .de-body{font-size:14.5px;line-height:2;text-align:justify;padding:0 16px;font-weight:500;color:#242424;}
  .doct-elegant .de-body p{margin:0 0 16px 0;text-indent:28px;}
  .doct-elegant .de-body p:first-child{text-indent:0;}
  .doct-elegant .de-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:60px;font-size:12.5px;color:#444;page-break-inside:avoid;break-inside:avoid;}
  .doct-elegant .de-sign{text-align:center;width:44%;}
  .doct-elegant .de-sign .line{border-top:1px solid var(--doc-primary, #16233F);margin-bottom:6px;}
  html.theme-dark .doc-preview-scroll .doct-elegant{background:#fff;color:#232323;}

  /* ---- Modèle MODERNE (documents officiels) ---- */
  .doct-modern{font-family:Arial,Helvetica,sans-serif;color:#222;background:#fff;border:1px solid #E2E5EC;border-radius:6px;overflow:hidden;}
  .doct-modern .dm-bar{background:var(--doc-primary, #16233F);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:14px;}
  .doct-modern .dm-bar .p-stamp-img{width:44px;height:44px;filter:brightness(0) invert(1);opacity:.9;}
  .doct-modern .dm-school{font-size:16px;font-weight:700;letter-spacing:.02em;}
  .doct-modern .dm-sub{font-size:11px;opacity:.85;margin-top:3px;}
  .doct-modern .dm-body-wrap{padding:24px 26px;}
  .doct-modern .dm-info{display:flex;flex-wrap:wrap;gap:8px 22px;background:#F4F6FA;border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:12.5px;color:#333;}
  .doct-modern .dm-info b{color:var(--doc-primary, #16233F);}
  .doct-modern .dm-title{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--doc-primary, #16233F);border-bottom:3px solid var(--doc-accent, #C9A227);padding-bottom:5px;margin-bottom:16px;}

  .pf-band-top{background:#1E5E43;padding:18px 20px 26px;position:relative;color:#fff;page-break-inside:avoid;break-inside:avoid;}

  .pf-band-stamp{position:absolute;right:20px;bottom:-22px;background:#fff;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.18);}
  .pf-band-stamp .p-stamp-img{width:40px;height:40px;}
  .pf-band-wrap{padding:30px 22px 20px;}
  .pf-band-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:#1E5E43;background:#EAF6EF;border-radius:8px;padding:10px 14px;margin-bottom:14px;page-break-inside:avoid;break-inside:avoid;}
  /* ---- Modèl 10 : PRESTIGE — kad double bòdo, prezantasyon estil diplòm ---- */
  .pf-prestige{font-family:Georgia,'Times New Roman',serif;color:#241414;background:#fff;padding:30px 34px;border:4px double #5C1A1A;text-align:center;}
  .pf-prestige-school{font-size:14px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#5C1A1A;}
  .pf-prestige-sub{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#1a1010;margin:10px 0 4px;}
  .pf-prestige-rule{width:140px;height:2px;background:#5C1A1A;margin:10px auto 16px;}
  .pf-prestige-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;font-size:12.5px;color:#463030;margin-bottom:18px;page-break-inside:avoid;break-inside:avoid;}
  .pf-prestige-body{font-size:13.5px;text-align:left;}
  html.theme-dark .pf-gold,html.theme-dark .pf-corp,html.theme-dark .pf-deco,html.theme-dark .pf-band,html.theme-dark .pf-prestige{background:#fff;color:#222;}

  /* ============ CUSTOM DIALOG (alert / confirm / prompt) ============ */
  .dlg-overlay{position:fixed;inset:0;background:rgba(20,22,26,.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .16s ease;}
  .dlg-overlay.dlg-show{opacity:1;}
  .dlg-box{background:var(--card);border-radius:14px;box-shadow:var(--shadow-pop);width:100%;max-width:400px;padding:26px 26px 20px;transform:translateY(10px) scale(.97);transition:transform .16s cubic-bezier(.2,.9,.3,1.2);}
  .dlg-overlay.dlg-show .dlg-box{transform:translateY(0) scale(1);}
  .dlg-icon{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .dlg-icon svg{width:24px;height:24px;}
  .dlg-icon.dlg-info{background:var(--blue-soft);color:var(--blue);}
  .dlg-icon.dlg-warn{background:#FCF0DC;color:var(--gold);}
  .dlg-icon.dlg-danger{background:#FBE6E5;color:var(--red);}
  .dlg-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:9px;line-height:1.3;letter-spacing:-.01em;}
  .dlg-msg{font-size:14.5px;color:var(--text-soft);line-height:1.55;white-space:pre-line;margin-bottom:22px;}
  .dlg-input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin:-6px 0 22px;font-family:inherit;background:#fff;transition:border-color .15s, box-shadow .15s;}
  .dlg-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
  .dlg-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}
  .dlg-btn{padding:10px 20px;border-radius:8px;border:none;font-size:14.5px;font-weight:700;cursor:pointer;transition:background-color .15s, box-shadow .15s;font-family:inherit;min-height:44px;white-space:normal;}
  @media (max-width:420px){ .dlg-actions{flex-direction:column-reverse;} .dlg-btn{width:100%;} }
  .dlg-btn-cancel{background:var(--bg);color:var(--text);}
  .dlg-btn-cancel:hover{background:var(--line-soft);}
  .dlg-btn-ok{background:var(--blue);color:#fff;}
  .dlg-btn-ok:hover{background:var(--blue-dark);}
  .dlg-btn-danger{background:var(--red);color:#fff;}
  .dlg-btn-danger:hover{background:#CC3931;}
  @media (max-width:420px){ .dlg-box{padding:22px 20px 16px;} }

  /* ============ TOAST NOTIFICATIONS (nouvo mesaj) ============ */
  .toast-container{position:fixed;top:16px;right:16px;z-index:99998;display:flex;flex-direction:column;gap:10px;max-width:340px;width:calc(100% - 32px);}
  .toast{background:var(--card);border-radius:12px;box-shadow:var(--shadow-pop);border:1px solid var(--line-soft);display:flex;align-items:flex-start;gap:11px;padding:13px 14px;cursor:pointer;opacity:0;transform:translateX(24px);transition:opacity .18s ease, transform .18s ease;}
  .toast.toast-show{opacity:1;transform:translateX(0);}
  .toast-icon{width:36px;height:36px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .toast-icon svg{width:19px;height:19px;}
  .toast-body{flex:1;min-width:0;}
  .toast-title{font-size:13.5px;font-weight:800;color:var(--text);margin-bottom:2px;}
  .toast-msg{font-size:13px;color:var(--text-soft);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .toast-close{background:transparent;border:none;color:var(--text-faint);font-size:18px;line-height:1;padding:2px 4px;border-radius:6px;flex-shrink:0;}

  @media (max-width:420px){ .toast-container{left:12px;right:12px;top:12px;max-width:none;} }

  .help-textarea{width:100%;min-height:130px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;font-size:15px;font-family:inherit;background:#fff;color:var(--text);resize:vertical;line-height:1.5;transition:border-color .15s, box-shadow .15s;}

  .wal-btn{position:relative;}
  .wal-badge{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;}

  .wal-price{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px;line-height:1.45;}

  .wal-req-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px;font-size:16px;}
  .wal-st{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 10px;}
  .wal-st-pending{background:#FFF4D6;color:#8A6100;}
  .wal-st-verified{background:#E3F6DD;color:#1F7A0E;}
  .wal-st-rejected{background:#FDECEC;color:#B3261E;}

  .wal-uid{font-size:12px;word-break:break-all;background:var(--bg);border-radius:8px;padding:8px 10px;margin:8px 0;}

  .wm-wrap{position:relative;}
  .wm-overlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:5;background-repeat:repeat;background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='260' height='170'%3E%3Ctext x='130' y='60' text-anchor='middle' transform='rotate(-28 130 85)' font-family='Arial,Helvetica,sans-serif' font-size='24' font-weight='800' fill='rgb(210,25,25)' fill-opacity='0.30'%3EPREMIUM - APERCU%3C/text%3E%3Ctext x='130' y='140' text-anchor='middle' transform='rotate(-28 130 85)' font-family='Arial,Helvetica,sans-serif' font-size='24' font-weight='800' fill='rgb(210,25,25)' fill-opacity='0.30'%3EPREMIUM - APERCU%3C/text%3E%3C/svg%3E");}

  @media print{ .wm-overlay,.wm-note{display:none !important;} }

  /* ============ EKRAN CHAJMAN OTOMATIK (pandan boot() ap konekte) ============ */
  .boot-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);}
  .boot-loader-inner{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .boot-loader-spin{width:46px;height:46px;border-radius:50%;border:4px solid rgba(24,119,242,.15);border-top-color:var(--blue);animation:boot-spin .8s linear infinite;}
  .boot-loader-text{display:flex;align-items:center;gap:2px;font-size:17px;font-weight:700;color:var(--blue);letter-spacing:.01em;}
  .boot-dots{display:inline-flex;gap:4px;margin-left:2px;}
  .boot-dots span{width:7px;height:7px;border-radius:50%;background:var(--blue);display:inline-block;animation:boot-bounce 1.1s ease-in-out infinite;}
  .boot-dots span:nth-child(2){animation-delay:.15s;}
  .boot-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes boot-spin{to{transform:rotate(360deg);}}
  @keyframes boot-bounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-7px);opacity:1;}}

const DLG_ICONS = {
  info:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".15" fill="currentColor" stroke-width="2.6"/></svg>`,

  danger:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5h15M9 6.5V4.8a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V6.5M6.5 6.5 7.3 19a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12.5"/></svg>`,
  ask:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 9a2.8 2.8 0 1 1 4.3 2.4c-.9.6-1.5 1.1-1.5 2.3"/><circle cx="12" cy="17.3" r=".15" fill="currentColor" stroke-width="2.6"/><circle cx="12" cy="12" r="9.5"/></svg>`,
};
function _dlgOpen(kind, title, message, opts){
  opts = opts||{};
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'dlg-overlay';
    const isPrompt = kind==='prompt';
    const isConfirm = kind==='confirm' || isPrompt;
    const iconKind = opts.icon || (kind==='alert' ? 'info' : isPrompt ? 'ask' : 'warn');
    const danger = !!opts.danger;
    overlay.innerHTML = `
      <div class="dlg-box" role="dialog" aria-modal="true">
        <div class="dlg-icon dlg-${danger?'danger':iconKind==='warn'?'warn':iconKind==='danger'?'danger':'info'}">${DLG_ICONS[iconKind]||DLG_ICONS.info}</div>
        ${title?`<div class="dlg-title"></div>`:''}
        <div class="dlg-msg"></div>
        ${isPrompt?`<input type="text" class="dlg-input" />`:''}
        <div class="dlg-actions">
          ${isConfirm?`<button type="button" class="dlg-btn dlg-btn-cancel" data-dlg="cancel">Anile</button>`:''}
          <button type="button" class="dlg-btn ${danger?'dlg-btn-danger':'dlg-btn-ok'}" data-dlg="ok">${opts.okLabel || (isConfirm?'OK':'OK')}</button>
        </div>
      </div>`;
    if(title) overlay.querySelector('.dlg-title').textContent = title;
    overlay.querySelector('.dlg-msg').textContent = message==null?'':String(message);
    const input = overlay.querySelector('.dlg-input');
    if(input){ input.value = opts.defaultValue||''; }
    document.body.appendChild(overlay);
    requestAnimationFrame(()=>overlay.classList.add('dlg-show'));
    const finish = (val)=>{
      overlay.classList.remove('dlg-show');
      setTimeout(()=>overlay.remove(), 140);
      document.removeEventListener('keydown', onKey);
      resolve(val);
    };
    const onKey = (e)=>{
      if(e.key==='Escape'){ finish(isPrompt?null:false); }
      if(e.key==='Enter' && (!input || document.activeElement===input)){ e.preventDefault(); finish(isPrompt?input.value:true); }
    };
    document.addEventListener('keydown', onKey);
    overlay.addEventListener('click', e=>{ if(e.target===overlay) finish(isPrompt?null:false); });
    overlay.querySelector('[data-dlg="ok"]').addEventListener('click', ()=>finish(isPrompt?input.value:true));
    const cancelBtn = overlay.querySelector('[data-dlg="cancel"]');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>finish(isPrompt?null:false));
    if(input){ setTimeout(()=>{ input.focus(); input.select(); }, 60); }
  });
}
function showAlert(message, opts){ return _dlgOpen('alert', (opts&&opts.title)||'Enfòmasyon', message, opts); }
function showConfirm(message, opts){ return _dlgOpen('confirm', (opts&&opts.title)||'Konfimasyon', message, opts); }
function showPrompt(message, defaultValue){ return _dlgOpen('prompt', 'Konfimasyon', message, {defaultValue}); }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function resizeImageToDataUrl(file, maxSize, quality, format){
  format = format || 'image/jpeg';
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')){ reject(new Error('Fichye a pa yon imaj')); return; }
    const reader = new FileReader();
    reader.onerror = ()=>reject(reader.error);
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Enposib chaje imaj la'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = Math.round(h * (maxSize / w)); w = maxSize; } }
        else{ if(h > maxSize){ w = Math.round(w * (maxSize / h)); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL(format, quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function genCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s="";
  for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function uniqueAdminUsername(email){
  const base = String(email||'').split('@')[0].toLowerCase().replace(/[^a-z0-9]/g,'') || 'admin';
  const taken = new Set((DATA.admins||[]).map(a=>String(a.username||'').toLowerCase()));
  let candidate = base, n = 1;
  while(taken.has(candidate)){ n++; candidate = base + n; }
  return candidate;
}
function initialsOf(name){
  const parts = String(name||'').trim().split(/\s+/);
  const s = (parts[0]?.[0]||'') + (parts[1]?.[0]||'');
  return s.toUpperCase() || '—';
}
function colorFor(name){
  let sum=0; for(const ch of String(name||'')) sum += ch.charCodeAt(0);
  return AVATAR_COLORS[sum % AVATAR_COLORS.length];
}
/* uid() = base36(Date.now()) + 6 random chars — we can recover the creation
   timestamp straight from the id without adding a new stored field. This is
   the "structure locale" the admin profile reads from for now; when Firebase
   Authentication is wired in later, this whole function can be swapped for
   the user's Firebase `metadata.creationTime` without touching callers. */
function accountCreatedAt(admin){
  if(!admin || !admin.id) return null;
  const tsPart = admin.id.slice(0, Math.max(0, admin.id.length-6));
  const t = parseInt(tsPart, 36);
  return isNaN(t) ? null : new Date(t);
}
function schoolInitials(){
  if(DATA.crestCode && DATA.crestCode.trim()) return DATA.crestCode.trim().toUpperCase().slice(0,3);

  if(parts.length===0) return 'WM';
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[1][0]).toUpperCase();
}

/* ===================== PWOFESÈ — pwofil inik + afektasyon =====================
   Yon pwofesè se YON SÈL pwofil global (DATA.teachers), separe de klas yo.
   Chak klas ka gen yon teacherId (mòd "yon sèl pwofesè") oswa, si
   cls.teacherMode==='multiple', chak matyè nan cls.subjects ka gen pwòp
   teacherId pa li. Konsa, menm moun nan pa janm double kèlkeswa konbyen
   klas/matyè/ane li anseye. */
function ensureTeachers(){ if(!Array.isArray(DATA.teachers)) DATA.teachers=[]; return DATA.teachers; }
/* Ti anyè "uid Firebase pwofesè → true" ki viv DIREKTEMAN nan done lekòl
   la (schools/$schoolId/teacherUids). Li pèmèt règ sekirite Firebase yo
   verifye "se vrèman yon pwofesè lekòl sa a k ap ekri", san yo pa bezwen
   fouye nan tout tablo DATA.teachers la (Firebase Rules pa ka fè sa). */
function ensureTeacherUids(){ if(!DATA.teacherUids || typeof DATA.teacherUids!=='object') DATA.teacherUids={}; return DATA.teacherUids; }
function findTeacherByUid(uidVal){ return uidVal ? ensureTeachers().find(t=>t.uid===uidVal) : null; }
function findTeacherById(id){ return id ? ensureTeachers().find(t=>t.id===id) : null; }
function teacherDisplayName(t){
  if(!t) return '';
  const full = [t.prenom, t.nom].filter(Boolean).join(' ').trim();
  return full || t.username || 'Pwofesè';
}
function splitFullName(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return {prenom:'', nom:''};
  if(parts.length===1) return {prenom:'', nom:parts[0]};
  return {prenom:parts[0], nom:parts.slice(1).join(' ')};
}
/* Nòmalize yon non pou konparezon — kolapse espas repete tou, pou "Jean  Pierre"
   (de espas) rekonèt kòm menm moun ak "Jean Pierre" */
function normNameKey(s){ return normSearch(s).replace(/\s+/g,' ').trim(); }
function normTeacherKey(prenom, nom){ return normNameKey([prenom||'', nom||''].join(' ')); }
function searchTeachers(query){
  const q = normSearch(query||'');
  if(!q) return [];
  return ensureTeachers().filter(t=>{
    const hay = normSearch([t.prenom,t.nom,t.username,t.phone,t.email].filter(Boolean).join(' '));
    return hay.includes(q);
  });
}
function findExactTeacherByName(fullName){
  const q = normNameKey(fullName||'');
  if(!q) return null;
  return ensureTeachers().find(t=> normNameKey(teacherDisplayName(t))===q || normNameKey(t.username||'')===q) || null;
}
/* Anti-doublon: pa baze sèlman sou non an — konfime tou ak telefòn/imèl si genyen */
function findPossibleDuplicateTeachers({prenom, nom, phone, email}, excludeId){
  const key = normTeacherKey(prenom, nom);
  const ph = (phone||'').trim();
  const em = normSearch(email||'');
  return ensureTeachers().filter(t=>{
    if(t.id===excludeId) return false;
    if(key && normTeacherKey(t.prenom, t.nom)===key) return true;
    if(ph && (t.phone||'').trim()===ph) return true;
    if(em && normSearch(t.email||'')===em) return true;
    return false;
  });
}
/* Efase yon pwofesè pou tout tan: retire pwofil li nan DATA.teachers,
   detache l de nenpòt klas/matyè kote li te asiyen (klas yo rete, jis
   yo pa gen pwofesè ankò pou pozisyon sa a), epi efase istwa mesaj
   Administration ↔ li. Aksyon sa a se yon aksyon administratè sèlman. */
function deleteTeacherById(teacherId){
  if(!teacherId) return;
  const t = findTeacherById(teacherId);
  if(t && t.uid && DATA.teacherUids) delete DATA.teacherUids[t.uid];
  DATA.teachers = ensureTeachers().filter(t=>t.id!==teacherId);
  const detach = c=>{
    if(c.teacherId===teacherId) c.teacherId=null;
    (c.subjects||[]).forEach(s=>{ if(s.teacherId===teacherId) s.teacherId=null; });
  };
  (DATA.classes||[]).forEach(detach);
  Object.values(DATA.academicYears||{}).forEach(yr=>(yr.classes||[]).forEach(detach));
  DATA.messages = ensureMessages().filter(m=>m.teacherId!==teacherId);
}
function createTeacher({prenom, nom, username, phone, email, code}){
  const t = { id:uid(), prenom:prenom||'', nom:nom||'', username: username || [prenom,nom].filter(Boolean).join(' ').trim() || 'Pwofesè',
    phone:phone||'', email:email||'', photo:null, sexe:'', dob:'', address:'', poste:'', diplome:'', experience:null,
    code: code || genCode(), createdAt: Date.now() };
  ensureTeachers().push(t);
  return t;
}

async function resolveOrCreateTeacherFromName(fullName){
  const name = (fullName||'').trim();
  if(!name) return null;
  const exact = findExactTeacherByName(name);
  if(exact) return exact;
  const {prenom, nom} = splitFullName(name);
  const dups = findPossibleDuplicateTeachers({prenom, nom});
  if(dups.length){
    const names = dups.map(teacherDisplayName).join(', ');
    const useExisting = await showConfirm(`« Professeur existant trouvé » : ${names}.\n\nOK pou itilize pwofil sa a (evite kreye yon dezyèm pwofil pou menm moun nan), oswa Anile pou kreye yon nouvo pwofesè separe.`);
    if(useExisting) return dups[0];
  }
  const created = createTeacher({prenom, nom});
  created._justCreated = true;
  return created;
}
/* Montre kòd koneksyon an lè yon NOUVO pwofesè fenk kreye, pou administratè a
   ka bay pwofesè a li san li pa oblije al chèche l nan Messages apre */
async function announceIfNewTeacher(teacher){
  if(teacher && teacher._justCreated){

    await showAlert(`Nouvo pwofesè kreye: ${teacherDisplayName(teacher)}.\n\nKòd koneksyon pwofesè a se: ${teacher.code}\n\nBay pwofesè a kòd sa a pou l konekte — se yon sèl kòd pou tout klas li yo. Ou ka toujou jwenn/chanje kòd sa a apre, nan Messages → pwofil pwofesè a.`);

}

function fmtTimeOnly(ts){ return new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
const MSG_EDIT_WINDOW_MS = 15*60*1000;
const MSG_DELETE_ALL_WINDOW_MS = 30*60*1000;

function visibleMessagesFor(teacherId, role){ return teacherMessagesList(teacherId).filter(m=>!(m.deletedFor||[]).includes(role)); }
function lastVisibleMessage(teacherId, role){ const l = visibleMessagesFor(teacherId, role); return l.length? l[l.length-1] : null; }
function canEditMsg(m, role){ return m.sender===role && !m.deletedForEveryone && (Date.now()-m.ts)<=MSG_EDIT_WINDOW_MS; }
function canDeleteAllMsg(m, role){ return m.sender===role && !m.deletedForEveryone && (Date.now()-m.ts)<=MSG_DELETE_ALL_WINDOW_MS; }

function renderMsgActionSheet(teacherId, role, teacher){

    btns += `<button type="button" class="msg-action-btn" data-msg-delete-me="${m.id}">🗑️ Supprimer pour moi</button>`;

  } else {

  }

/* Branche tout evenman popup/aksyon/edit pou yon konvèsasyon (itilize pou admin ak pwofesè) */
function wireMessageThread(teacherId, role, rerender){
  document.querySelectorAll('[data-msg-id]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const id = el.dataset.msgId;
    ui.msgActionFor = (ui.msgActionFor===id) ? null : id;
    rerender();
  }));
  document.querySelectorAll('[data-msg-action-close]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target !== el) return;
    ui.msgActionFor = null; rerender();
  }));
  const sheet = document.querySelector('[data-msg-sheet]');
  if(sheet) sheet.addEventListener('click', e=>e.stopPropagation());
  document.querySelectorAll('[data-msg-edit-start]').forEach(el=>el.addEventListener('click', ()=>{
    ui.msgEditId = el.dataset.msgEditStart; ui.msgActionFor = null; rerender();
  }));
  document.querySelectorAll('[data-msg-edit-cancel]').forEach(el=>el.addEventListener('click', ()=>{
    ui.msgEditId = null; rerender();
  }));
  document.querySelectorAll('[data-msg-edit-form]').forEach(f=>f.addEventListener('submit', async e=>{
    e.preventDefault();
    const id = f.dataset.msgEditForm;
    const ta = f.querySelector('[data-msg-edit-textarea]');
    const text = ta.value.trim();
    const m = ensureMessages().find(x=>x.id===id);
    if(!m || !text){ ui.msgEditId=null; rerender(); return; }
    if(!canEditMsg(m, role)){ await showAlert('Delè modifikasyon an (15 minit) pase.'); ui.msgEditId=null; rerender(); return; }
    m.text = text; m.editedAt = Date.now();
    ui.msgEditId = null;
    await saveData(); rerender();
  }));
  document.querySelectorAll('[data-msg-delete-me]').forEach(el=>el.addEventListener('click', async ()=>{
    const id = el.dataset.msgDeleteMe;
    const m = ensureMessages().find(x=>x.id===id);
    if(m){ if(!Array.isArray(m.deletedFor)) m.deletedFor=[]; if(!m.deletedFor.includes(role)) m.deletedFor.push(role); }
    ui.msgActionFor = null;
    await saveData(); rerender();
  }));
  document.querySelectorAll('[data-msg-delete-all]').forEach(el=>el.addEventListener('click', async ()=>{
    const id = el.dataset.msgDeleteAll;
    const m = ensureMessages().find(x=>x.id===id);
    if(m){
      if(!canDeleteAllMsg(m, role)){ await showAlert('Delè "Supprimer pour tout le monde" a (30 minit) pase.'); ui.msgActionFor=null; rerender(); return; }
      m.deletedForEveryone = true; m.deletedAt = Date.now(); m.text='';
    }
    ui.msgActionFor = null;
    await saveData(); rerender();
  }));
}

/* ---- Kachèt ofisyèl (kèt SVG pou enprime) ---- */
const STAMP_MODELS = [
  { id:'classic',  label:'Klasik' },
  { id:'notarial', label:'Notaryal' },
  { id:'modern',   label:'Sobri modèn' }
];
function ensureStamp(){
  if(!DATA.stamp){
    DATA.stamp = { top:'', bottom:'REPIBLIK DAYITI', center:schoolInitials(), slogan:'', color:'#1c3a5e', style:'classic' };
  }
  if(!DATA.stamp.top) DATA.stamp.top = String(DATA.schoolName||'').toUpperCase();
  if(DATA.stamp.slogan===undefined) DATA.stamp.slogan = '';
  if(!DATA.stamp.color) DATA.stamp.color = '#1c3a5e';
  if(!DATA.stamp.style || !STAMP_MODELS.some(m=>m.id===DATA.stamp.style)) DATA.stamp.style = 'classic';
  return DATA.stamp;
}
function loopedSloganText(txt){
  const clean = String(txt||'').trim().toUpperCase();
  if(!clean) return '';
  const unit = clean + '   \u2726   ';
  let out = '';
  while(out.length < 110) out += unit;
  return out;
}
function stampFit(text, baseSize, baseLs, maxChars){
  // Si tèks la pi long pase sa ki ka kenbe sou wout kwochi a san l pa
  // debòde sou lòt liy lan, redui gwosè ak espasman lèt yo an pwopòsyon,
  // jouk yon minimòm rezonab, pou l toujou rete byen ranje nan kachèt la.
  const len = String(text||'').length || 1;
  const scale = len <= maxChars ? 1 : Math.max(maxChars/len, 0.5);
  return { size:+(baseSize*scale).toFixed(2), ls:+(baseLs*scale).toFixed(2) };
}
function stampStarPath(cx, cy, rOuter, rInner, points){
  const step = Math.PI / points;
  let d = '';
  for(let i=0;i<points*2;i++){
    const r = i % 2 === 0 ? rOuter : rInner;
    const ang = (-90 * Math.PI/180) + i*step;
    const x = (cx + r*Math.cos(ang)).toFixed(2);
    const y = (cy + r*Math.sin(ang)).toFixed(2);
    d += (i===0 ? 'M' : 'L') + x + ',' + y + ' ';
  }
  return d + 'Z';
}
function stampTickRing(cx, cy, rOuter, rInner, count, col){
  let out = '';
  for(let i=0;i<count;i++){
    const ang = (360/count) * i * Math.PI/180;
    const x1 = (cx + rOuter*Math.cos(ang)).toFixed(2), y1 = (cy + rOuter*Math.sin(ang)).toFixed(2);
    const x2 = (cx + rInner*Math.cos(ang)).toFixed(2), y2 = (cy + rInner*Math.sin(ang)).toFixed(2);
    out += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="0.8" stroke-opacity="0.5"/>`;
  }
  return out;
}
let __stampUid = 0;
function printStampSvg(stamp){
  const s = stamp || ensureStamp();
  const col = s.color || '#1c3a5e';
  const style = STAMP_MODELS.some(m=>m.id===s.style) ? s.style : 'classic';
  const esc = escapeHtml;
  const slogan = loopedSloganText(s.slogan);
  const topTxt = s.top || '';
  const useStars = style !== 'modern';
  const botTxt = useStars ? `\u2605 ${s.bottom||''} \u2605` : (s.bottom||'');
  const isModern = style === 'modern';
  const font = isModern ? "'Helvetica Neue',Arial,sans-serif" : "Georgia,'Times New Roman',Times,serif";
  const weight = isModern ? 600 : 900;
  const top = stampFit(topTxt, isModern ? 12 : 13, isModern ? 2.3 : 1.6, 18);
  const bot = stampFit(botTxt, isModern ? 10.5 : 11.5, isModern ? 2.4 : 2, 22);
  const uid = 'sg' + (__stampUid++) + Math.random().toString(36).slice(2,6);
  const idTop = 't'+uid, idBot = 'b'+uid, idMid = 'm'+uid;
  const textR = isModern ? 84 : 80;

  let rings = '', ornament = '', centerExtra = '';
  if(style === 'classic'){
    rings = `
      <circle cx="100" cy="100" r="95" fill="none" stroke="${col}" stroke-width="1.1"/>
      <circle cx="100" cy="100" r="${textR}" fill="none" stroke="${col}" stroke-width="3.2"/>
      <circle cx="100" cy="100" r="68" fill="none" stroke="${col}" stroke-width="0.8" stroke-dasharray="0.6 4.2"/>
      <circle cx="100" cy="100" r="56" fill="none" stroke="${col}" stroke-width="1"/>`;
  } else if(style === 'notarial'){
    rings = `
      <circle cx="100" cy="100" r="96" fill="none" stroke="${col}" stroke-width="1"/>
      <circle cx="100" cy="100" r="${textR}" fill="none" stroke="${col}" stroke-width="3"/>
      <circle cx="100" cy="100" r="56" fill="none" stroke="${col}" stroke-width="1"/>`;
    ornament = stampTickRing(100,100,68,60,60,col)
      + `<path d="${stampStarPath(100,133,4.4,1.9,5)}" fill="${col}" fill-opacity="0.7"/>`;
  } else {
    rings = `
      <circle cx="100" cy="100" r="98" fill="none" stroke="${col}" stroke-width="1"/>
      <circle cx="100" cy="100" r="${textR}" fill="none" stroke="${col}" stroke-width="1"/>`;
    centerExtra = `<line x1="72" y1="122" x2="128" y2="122" stroke="${col}" stroke-width="1"/>`;
  }

  return `<svg class="p-stamp-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <path id="${idTop}" d="M 20,100 A ${textR},${textR} 0 1 1 180,100"/>
      <path id="${idBot}" d="M 180,100 A ${textR},${textR} 0 1 1 20,100"/>
      <path id="${idMid}" d="M 100,34 A 66,66 0 1 1 99.99,34.001"/>
    </defs>
    ${rings}
    ${ornament}
    <text font-family="${font}" font-size="${top.size}" font-weight="${weight}" letter-spacing="${top.ls}" fill="${col}"><textPath href="#${idTop}" startOffset="50%" text-anchor="middle">${esc(topTxt)}</textPath></text>
    <text font-family="${font}" font-size="${bot.size}" font-weight="${weight}" letter-spacing="${bot.ls}" fill="${col}"><textPath href="#${idBot}" startOffset="50%" text-anchor="middle">${esc(botTxt)}</textPath></text>
    ${slogan ? `<text font-family="${font}" font-size="7.2" font-weight="700" letter-spacing="0.8" dominant-baseline="middle" fill="${col}"><textPath href="#${idMid}" startOffset="0%">${esc(slogan)}</textPath></text>` : ''}
    ${centerExtra}
    <text x="100" y="112" font-family="${font}" font-size="${isModern?29:32}" font-weight="${weight}" letter-spacing="2" fill="${col}" text-anchor="middle">${esc(s.center||'')}</text>
  </svg>`;
}

/* ---- Aparans (tèm klè / fonse) — preferans pèsonèl aparèy la ---- */
async function loadAppearance(){
  try{ const r = await window.storage.get('appearance', false); if(r) return r.value; }catch(e){}
  try{ const v = localStorage.getItem('appearance'); if(v) return v; }catch(e){}
  return 'light';
}
async function saveAppearance(mode){
  try{ await window.storage.set('appearance', mode, false); }catch(e){}
  try{ localStorage.setItem('appearance', mode); }catch(e){}
